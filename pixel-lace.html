<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leroy — pixel lace</title>
  <style>
    /* Laid out like Emergence — light ground, controls in a card on the left,
       the work beside it — in the studio's own colours rather than that
       project's greens, so the olive the panels are made of is the olive the
       interface is made of too. */
    :root {
      --c-white: #ffffff;
      --c-cream: #fbf4dd;
      --c-yellow: #fff278;
      --c-olive: #86842d;
      --c-dark-olive: #403b12;
      --c-charcoal: #2a2a2a;
      --c-black: #181818;

      --bg: var(--c-white);
      --bg-elevated: var(--c-white);
      --ink: var(--c-black);
      --ink-muted: rgba(24, 24, 24, 0.55);
      --accent: var(--c-dark-olive);
      --accent-soft: rgba(134, 132, 45, 0.16);
      --border: rgba(64, 59, 18, 0.16);
      --radius-lg: 16px;
      --radius-md: 8px;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.04), 0 8px 24px rgba(0, 0, 0, 0.05);
      --font: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
      font-family: var(--font); font-size: 12px; line-height: 1.45; overflow: hidden;
      -webkit-font-smoothing: antialiased; }
    body { display: flex; flex-direction: column; }

    /* the wordmark sits over the whole tool, not inside its controls */
    .topnav { flex: none; display: flex; align-items: center; gap: 14px;
      padding: 14px 32px; border-bottom: 1px solid var(--border);
      background: var(--bg-elevated); }
    .topnav .wordmark { display: block; height: 40px; width: auto; }
    /* What a thing is set to, rather than a button you press: a switch that
       turns a whole section on or off sits on that section's own header. */
    h2 .switch { margin: 0 0 0 auto; }
    .switch > span { margin-bottom: 0; }
    h2:has(.switch) { display: flex; align-items: center; gap: 8px; }
    .switch { display: inline-flex; align-items: center; gap: 8px; cursor: pointer;
      font-size: 0.75rem; color: var(--ink-muted); user-select: none; }
    .switch input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch .track { position: relative; width: 34px; height: 20px; flex: none;
      border: 1px solid var(--border); border-radius: 999px; background: var(--accent-soft);
      transition: background .15s, border-color .15s; }
    .switch .track::after { content: ""; position: absolute; top: 2px; left: 2px;
      width: 14px; height: 14px; border-radius: 50%; background: var(--c-olive);
      transition: transform .15s, background .15s; }
    .switch input:checked + .track { background: var(--c-olive); border-color: var(--c-olive); }
    .switch input:checked + .track::after { transform: translateX(14px); background: var(--c-white); }
    .switch input:focus-visible + .track { outline: 2px solid var(--accent-soft); outline-offset: 2px; }
    .switch:hover { color: var(--ink); }

    /* rail first, then the stage */
    #wrap { flex: 1; min-height: 0; display: flex; align-items: flex-start; gap: 28px;
      padding: 28px 32px; }
    aside { flex: 0 1 300px; width: 300px; min-width: 240px; align-self: stretch; overflow-y: auto;
      padding: 16px; background: var(--bg-elevated); border: 1px solid var(--border);
      border-radius: var(--radius-lg); box-shadow: var(--shadow); }
    #stageWrap { flex: 1; min-width: 0; align-self: stretch; overflow: hidden;
      position: relative; }

    #stage { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%;
      box-shadow: var(--shadow); }
    #stage.alpha, #lg-c.alpha, .swatches button.clear {
      background-image:
        linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%),
        linear-gradient(45deg, #d9d9d9 25%, transparent 25%, transparent 75%, #d9d9d9 75%);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      background-color: var(--c-white);
    }
    #drop { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
      color: var(--ink-muted); opacity: 0; transition: opacity .15s; font-size: 14px; }
    #drop.on { opacity: 1; background: rgba(251, 244, 221, .88); }

    /* a hairline between sections, the way the rail groups read there */
    h2 { margin: 16px 0 10px; padding-top: 14px; border-top: 1px solid var(--border);
      font-size: 1.1rem; font-weight: 400; letter-spacing: .01em; color: var(--ink); }
    .tabpanel > h2:first-child { margin-top: 0; padding-top: 0; border-top: none; }

    /* Look and movement are separate jobs, so they get separate tabs; the
       output row stays under both. */
    .tabs { position: sticky; top: -16px; z-index: 1; display: flex; gap: 4px;
      margin: -16px -16px 16px; padding: 12px 16px 0; background: var(--bg-elevated);
      border-bottom: 1px solid var(--border); }
    .tabs button { flex: 1; margin-bottom: -1px; padding: 8px 12px; border: none;
      border-bottom: 2px solid transparent; border-radius: 0; background: none;
      color: var(--ink-muted); }
    .tabs button:hover { background: none; color: var(--ink); }
    .tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--c-olive); }
    .tabpanel[hidden], aside [hidden] { display: none; }

    /* the Logo tab's own stage: the particulate canvas, scrolled when it is
       shown larger than there is room for */
    #logoStage { position: absolute; inset: 0; overflow: auto; display: grid; place-items: center;
      padding: 24px; }
    #logoStage[hidden] { display: none; }
    #lg-c { display: block; box-shadow: var(--shadow); }
    input[type=text] { width: 100%; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg-elevated); color: var(--ink); font: inherit; }
    #lg-stat { margin-top: 8px; color: var(--ink-muted); }
    @font-face { font-family: 'Garara Italic'; src: url('fonts/Garara-Italic.woff2') format('woff2'); }
    @font-face { font-family: 'Neue Haas Grotesk Roman'; src: url('fonts/NeueHaasGroteskDisplay-55Roman.otf'); }
    @font-face { font-family: 'Neue Haas Grotesk Bold'; src: url('fonts/NeueHaasGroteskDisplay-75Bold.otf'); }

    label { display: block; margin-bottom: 10px; }
    label > span { display: flex; justify-content: space-between; align-items: baseline;
      gap: 8px; color: var(--ink-muted); margin-bottom: 4px; }
    label > span b { color: var(--ink); font-weight: 400; font-variant-numeric: tabular-nums; }

    input[type=range] { width: 100%; height: 4px; appearance: none; background: transparent;
      cursor: pointer; }
    input[type=range]::-webkit-slider-runnable-track { height: 4px; border-radius: 2px;
      background: var(--accent-soft); }
    input[type=range]::-webkit-slider-thumb { appearance: none; width: 14px; height: 14px;
      margin-top: -5px; border: none; border-radius: 50%;
      background: var(--c-olive); box-shadow: 0 1px 3px rgba(0,0,0,.15); }
    input[type=range]::-moz-range-track { height: 4px; border-radius: 2px; background: var(--accent-soft); }
    input[type=range]::-moz-range-progress { height: 4px; border-radius: 2px; background: var(--c-olive); }
    input[type=range]::-moz-range-thumb { width: 14px; height: 14px; border: none;
      border-radius: 50%; background: var(--c-olive); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

    select, input[type=number] { width: 100%; padding: 6px 8px; border: 1px solid var(--border);
      border-radius: 6px; background: var(--bg-elevated); color: var(--ink); font: inherit; }
    select:focus-visible, input[type=number]:focus-visible { outline: 2px solid var(--accent-soft);
      border-color: var(--accent); }

    .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
    .swatches button.clear { background-size: 8px 8px; background-position: 0 0, 4px 4px; }
    .swatches button { padding: 0; height: 20px; border-radius: 4px; border: 1px solid var(--border);
      cursor: pointer; }
    .swatches button:hover { border-color: rgba(0,0,0,.35); }
    .swatches button[data-on="true"] { outline: 2px solid var(--accent); outline-offset: 1px;
      border-color: transparent; }

    .row { display: flex; gap: 8px; }
    .row > * { flex: 1; }
    button { display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-md);
      background: var(--bg-elevated); color: var(--ink); font-family: var(--font);
      font-size: 0.8125rem; font-weight: 600; letter-spacing: .01em; cursor: pointer;
      transition: background .15s, border-color .15s, color .15s; }
    button:hover { background: var(--accent); border-color: var(--accent); color: var(--c-white); }
    button[data-on="true"] { background: var(--ink); border-color: var(--ink); color: var(--c-white); }

    .mini { display: flex; gap: 8px; }
    .mini label { flex: 1; }
    .seqrow { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .seqrow canvas { width: 34px; height: 26px; object-fit: cover; border: 1px solid var(--border);
      border-radius: 4px; background: var(--bg); flex: 0 0 auto; }
    .seqrow input { flex: 1; }
    .seqrow button { flex: 0 0 auto; padding: 2px 7px; font-weight: 400; color: var(--ink-muted); }
    .seqrow b { flex: 0 0 38px; text-align: right; font-weight: 400;
      font-variant-numeric: tabular-nums; color: var(--ink-muted); }
    /* Narrow enough and the two cannot sit side by side: the rail goes above
       the work rather than squeezing it to nothing. */
    @media (max-width: 720px) {
      #wrap { flex-direction: column; min-height: 0; padding: 16px; }
      html, body { overflow: auto; }
      body { height: auto; min-height: 100%; }
      .topnav { padding: 12px 16px; }
      aside { flex: none; width: 100%; min-width: 0; align-self: auto; }
      #stageWrap { width: 100%; align-self: auto; min-height: 60vh; }
    }
  </style>
</head>
<body>
<header class="topnav">
  <img class="wordmark" src="logo.png" alt="Archuedy" />
</header>

<div id="wrap">
  <aside>
    <nav class="tabs" role="tablist">
      <button role="tab" data-tab="design" aria-selected="true">Design</button>
      <button role="tab" data-tab="motion" aria-selected="false">Motion</button>
      <button role="tab" data-tab="logo" aria-selected="false">Logo</button>
    </nav>
    <div class="tabpanel" id="tab-design" role="tabpanel">
    <h2>Panel</h2>
    <label><select id="preset">
      <option value="1080x1350">1080 × 1350 — portrait 4:5</option>
      <option value="1080x1920">1080 × 1920 — story 9:16</option>
      <option value="1080x1080">1080 × 1080 — square</option>
      <option value="1200x1500">1200 × 1500 — portrait 4:5 large</option>
      <option value="1200x630">1200 × 630 — link preview</option>
      <option value="1920x1080">1920 × 1080 — landscape 16:9</option>
      <option value="1400x1000">1400 × 1000 — landscape panel</option>
      <option value="1350x1800">1350 × 1800 — 18 × 24 print</option>
      <option value="custom">custom…</option>
    </select></label>
    <div class="mini">
      <label><span>Width <b id="v-ar"></b></span>
        <input type="number" id="pw" min="200" max="4000" step="10" value="1400" /></label>
      <label><span>Height</span>
        <input type="number" id="ph" min="200" max="4000" step="10" value="1000" /></label>
    </div>
    <label><span>Background <b id="v-bg"></b></span><div class="swatches" id="bgSw"></div></label>
    <label><span>Particles <b id="v-ink"></b></span><div class="swatches" id="inkSw"></div></label>

    <h2>Grid</h2>
    <label><span>Columns <b id="v-cols"></b></span>
      <input id="cols" type="range" min="24" max="400" step="2" value="220" /></label>
    <label><span>Gap <b id="v-gap"></b></span>
      <input id="gap" type="range" min="0" max="0.6" step="0.02" value="0.18" /></label>
    <label><span>Scatter <b id="v-scatter"></b></span>
      <input id="scatter" type="range" min="0" max="1.5" step="0.05" value="0" /></label>
    <label><span>Vary <b id="v-vary"></b></span>
      <input id="vary" type="range" min="0" max="0.9" step="0.05" value="0" /></label>
    <label><span>Swell <b id="v-swell"></b></span>
      <input id="swell" type="range" min="0" max="0.8" step="0.05" value="0.3" /></label>
    <label><span>Blur <b id="v-soft"></b></span>
      <input id="soft" type="range" min="0" max="3" step="0.1" value="0.8" /></label>
    <label><span>Dither <b id="v-dither"></b></span>
      <input id="dither" type="range" min="0" max="1" step="0.05" value="0.35" /></label>

    <h2>Ink</h2>
    <label><span>Threshold <b id="v-threshold"></b></span>
      <input id="threshold" type="range" min="0.02" max="0.95" step="0.01" value="0.2" /></label>
    <label><span>Contrast <b id="v-contrast"></b></span>
      <input id="contrast" type="range" min="0.4" max="4" step="0.1" value="1" /></label>

    <h2>Motif</h2>
    <label><span>Seed</span>
      <div class="row">
        <button id="seedDown" style="flex:0 0 32px">◀</button>
        <input type="number" id="seed" value="20260917" style="flex:1; text-align:center" />
        <button id="seedUp" style="flex:0 0 32px">▶</button>
        <button id="shuffle" style="flex:0 0 auto">Shuffle</button>
      </div>
    </label>
    <label id="symmetryRow" style="margin-top:8px"><span>Symmetry</span><select id="symmetry">
      <option value="mirror4">mirrored — both axes</option>
      <option value="none">none — a single spray</option>
      <option value="mirrorX">mirrored — one axis</option>
      <option value="rot4">turned — four-fold</option>
      <option value="kaleido8">kaleidoscope — eight</option>
      <option value="tile">half-drop repeat</option>
    </select></label>
    <label id="repeatRow" hidden><span>Repeat <b id="v-repeat"></b></span>
      <input id="repeat" type="range" min="2" max="10" step="1" value="4" /></label>
    <label style="margin-top:8px"><span>Source</span><select id="source">
      <option value="motif">generated motif</option>
      <option value="imageLace">image — laced</option>
      <option value="image">image — flat</option>
    </select></label>
    <div class="row">
      <button id="upload">Upload image…</button>
      <button id="invert" data-on="false" data-for="image">Invert</button>
    </div>
    <label data-for="image" style="margin-top:8px"><span>Read as</span><select id="read">
      <option value="edges">edges — linework</option>
      <option value="tone">tone — light and dark</option>
    </select></label>
    <label id="zoomRow"><span>Image zoom <b id="v-zoom"></b></span>
      <input id="zoom" type="range" min="0.4" max="3" step="0.05" value="1" /></label>
    <input type="file" id="file" accept="image/*" hidden />

    <div data-for="motif">
    <h2>Branches</h2>
    <label><span>Stems <b id="v-stems"></b></span>
      <input id="stems" type="range" min="1" max="9" step="1" value="5" /></label>
    <label><span>Spread <b id="v-spread"></b></span>
      <input id="spread" type="range" min="0" max="1" step="0.02" value="0.38" /></label>
    <label><span>Leafiness <b id="v-leafiness"></b></span>
      <input id="leafiness" type="range" min="0" max="2" step="0.05" value="0.9" /></label>

    <h2>Center piece</h2>
    <label><span>Medallion <b id="v-medallion"></b></span>
      <input id="medallion" type="range" min="0" max="0.7" step="0.02" value="0.26" /></label>
    <label><span>Petals <b id="v-petals"></b></span>
      <input id="petals" type="range" min="3" max="16" step="1" value="8" /></label>
    </div>

    <h2>Border
      <label class="switch"><input type="checkbox" id="borderSw" aria-label="Border" checked /><span class="track"></span></label></h2>
    <label class="switch"><span>Corners</span>
      <input type="checkbox" id="cornersSw" checked /><span class="track"></span></label>

    <h2>Riso
      <label class="switch"><input type="checkbox" id="risoSw" aria-label="Riso" /><span class="track"></span></label></h2>
    <label><span>Grain <b id="v-grain"></b></span>
      <input id="grain" type="range" min="0" max="1" step="0.05" value="0.2" /></label>
    <label><span>Mottle <b id="v-mottle"></b></span>
      <input id="mottle" type="range" min="0" max="1" step="0.05" value="0.45" /></label>
    <label><span>Speckle <b id="v-speckle"></b></span>
      <input id="speckle" type="range" min="0" max="1" step="0.05" value="0.05" /></label>

    <!-- stills only: a motion leaves as a recording, from its own tab -->
    <h2>Output</h2>
    <div class="row"><button id="save">Save PNG</button><button id="saveSvg">Save SVG</button></div>
    </div>

    <div class="tabpanel" id="tab-motion" role="tabpanel" hidden>
    <div class="row" id="motionTarget" style="margin-bottom:10px">
      <button data-target="lace" data-on="true">Lace</button>
      <button data-target="logo" data-on="false">Logo</button>
    </div>
    <label><select id="motion">
      <option value="branch">branch — grows out from the middle along its arms</option>
      <option value="gather">gather — stitches fly in and settle into the shape</option>
      <option value="weight">weight — the faint parts go first, the dense last</option>
      <option value="breathe">breathe — opens and closes as one</option>
      <option value="morph">morph — one image into the next</option>
    </select></label>
    <label><select id="transition">
      <option value="contract">contract — from an even grid, nearest first</option>
      <option value="corner">corner — across, then down</option>
      <option value="fall">fall — down the column into place</option>
      <option value="edges">edges — in from the sides</option>
      <option value="settle">settle — the shortest move each can make</option>
      <option value="swap">swap — from anywhere on the grid</option>
    </select></label>
    <label id="lagRow"><span>Offset <b id="v-lag"></b></span>
      <input id="lag" type="range" min="0" max="6" step="0.25" value="0" /></label>
    <label><span>Steps <b id="v-steps"></b></span>
      <input id="steps" type="range" min="4" max="40" step="1" value="15" /></label>
    <label id="flareRow"><span>Flare <b id="v-flare"></b></span>
      <input id="flare" type="range" min="0" max="1.5" step="0.05" value="0.6" /></label>
    <label><span>Frames per second <b id="v-fps"></b></span>
      <input id="fps" type="range" min="2" max="24" step="1" value="8" /></label>
    <label><span id="amountLabel">Amount <b id="v-amount"></b></span>
      <input id="amount" type="range" min="0.05" max="1" step="0.05" value="0.4" /></label>
    <div class="row" id="morphRow">
      <button id="morphImg">Add images…</button>
      <button id="fitAll">Fit each</button>
      <button id="clearMorphImg">Clear</button>
    </div>
    <input type="file" id="fileB" accept="image/*" multiple hidden />
    <div id="seqList"></div>
    <div class="row" style="margin-top:6px">
      <button id="play">Play</button>
      <button id="record">Record 5s</button>
    </div>

    </div>


    <div class="tabpanel" id="tab-logo" role="tabpanel" hidden>
    <h2>Look</h2>
    <input type="checkbox" id="lg-alpha" hidden />
    <label><select id="lg-preset">
      <option value="archadia">archadia — the house look</option>
      <option value="contour">contour cloud — dots trace the edges</option>
      <option value="wordmark">wordmark — solid letters and spray</option>
      <option value="custom">custom</option>
    </select></label>
    <label><span>Background <b id="lg-vBgC"></b></span><div class="swatches" id="lg-bgSw"></div></label>
    <label><span>Particles <b id="lg-vInkC"></b></span><div class="swatches" id="lg-inkSw"></div></label>
    <input type="hidden" id="lg-bgc" value="#403b12" />
    <input type="hidden" id="lg-inkc" value="#fff278" />

    <h2>Source</h2>
    <label><select id="lg-src">
      <option value="text">typed word</option>
      <option value="image">image file</option>
    </select></label>
    <input type="file" id="lg-imgFile" accept="image/*" hidden />
    <div data-for="image">
    <button id="lg-upload" style="width:100%; margin-bottom:10px">Upload image…</button>
    <label><span>Threshold <b id="lg-vThr"></b></span>
      <input type="range" id="lg-thr" min="1" max="254" value="128" /></label>
    <label><span>Padding <b id="lg-vPad"></b></span>
      <input type="range" id="lg-pad" min="0" max="60" value="18" /></label>
    <label><span>Ink is</span><select id="lg-imgink">
      <option value="dark">dark pixels</option>
      <option value="light">light pixels</option>
      <option value="opaque">opaque areas</option>
      <option value="hole">transparent areas — knockout art</option>
    </select></label>
    </div>

    <div data-for="text">
    <h2>Type</h2>
    <label><span>Word</span><input type="text" id="lg-word" value="Archadia" /></label>
    <label><span>Typeface</span><select id="lg-face">
      <option value="Garara Italic">Garara Italic</option>
      <option value="Neue Haas Grotesk Roman">Neue Haas Grotesk 55 Roman</option>
      <option value="Neue Haas Grotesk Bold">Neue Haas Grotesk 75 Bold</option>
    </select></label>
    <div>
    <label><span>Letter width <b id="lg-vWide"></b></span>
      <input type="range" id="lg-wide" min="40" max="260" value="60" /></label>
    <label><span>Tracking <b id="lg-vTrack"></b></span>
      <input type="range" id="lg-track" min="-120" max="300" value="0" /></label>
    </div>
    <label><span>Layout</span><select id="lg-layout">
      <option value="row">horizontal banner</option>
      <option value="stack">vertical stack — poster</option>
    </select></label>
    <label id="lg-alignRow"><span>Align</span>
      <div class="row" id="lg-alignBtns">
        <button data-align="left" data-on="false">Left</button>
        <button data-align="center" data-on="true">Centre</button>
        <button data-align="right" data-on="false">Right</button>
      </div>
      <input type="hidden" id="lg-align" value="center" /></label>
    </div>

    <h2>Particles</h2>
    <label><span>Seed</span>
      <div class="row">
        <button id="lg-seedDown" style="flex:0 0 32px">◀</button>
        <input type="number" id="lg-seed" min="0" value="410" style="flex:1; text-align:center" />
        <button id="lg-seedUp" style="flex:0 0 32px">▶</button>
        <button id="lg-rand" style="flex:0 0 auto">Shuffle</button>
      </div>
    </label>
    <label><select id="lg-mode">
      <option value="all">letters and escaping spray — full field</option>
      <option value="in">inside only — the letters are the particles</option>
      <option value="out">outside only — shape knocked out</option>
      <option value="both">solid shape and spray</option>
    </select></label>
    <label><span>Particles (k) <b id="lg-vN"></b></span>
      <input type="range" id="lg-n" min="20" max="900" value="900" /></label>
    <label><span>Spray distance <b id="lg-vSpray"></b></span>
      <input type="range" id="lg-spray" min="0" max="700" value="127" /></label>
    <label><span>Swirl <b id="lg-vSwirl"></b></span>
      <input type="range" id="lg-swirl" min="0" max="160" value="160" /></label>
    <label><span>Flow scale <b id="lg-vScale"></b></span>
      <input type="range" id="lg-scale" min="5" max="120" value="59" /></label>
    <label><span>Drift X <b id="lg-vDx"></b></span>
      <input type="range" id="lg-dx" min="-150" max="150" value="7" /></label>
    <label><span>Drift Y <b id="lg-vDy"></b></span>
      <input type="range" id="lg-dy" min="-100" max="100" value="32" /></label>
    <label><span>Edge bias <b id="lg-vEdge"></b></span>
      <input type="range" id="lg-edge" min="0" max="100" value="12" /></label>
    <label><span>Core <b id="lg-vCore"></b></span>
      <input type="range" id="lg-core" min="0" max="100" value="0" /></label>

    <h2>Ink</h2>
    <label><span>Ink density <b id="lg-vInk"></b></span>
      <input type="range" id="lg-ink" min="5" max="300" value="163" /></label>
    <label><span>Grain <b id="lg-vGrain"></b></span>
      <input type="range" id="lg-grain" min="0" max="100" value="41" /></label>
    <label><span>Particle size (px) <b id="lg-vDotpx"></b></span>
      <input type="range" id="lg-dotpx" min="1" max="12" value="2" /></label>
    <label><span>Outside strength <b id="lg-vOut"></b></span>
      <input type="range" id="lg-outw" min="0" max="200" value="60" /></label>
    <label><span>Letter solidity <b id="lg-vSolid"></b></span>
      <input type="range" id="lg-solid" min="0" max="100" value="45" /></label>
    <label><span>Distress gradient <b id="lg-vGrad"></b></span>
      <input type="range" id="lg-grad" min="0" max="100" value="65" /></label>
    <label><span>Gradient direction</span><select id="lg-graddir">
      <option value="lr">clean left → distressed right</option>
      <option value="rl">clean right → distressed left</option>
      <option value="tb">clean top → distressed bottom</option>
      <option value="bt">clean bottom → distressed top</option>
    </select></label>

    <h2>Output</h2>
    <div class="row"><button id="lg-dlPng">Save PNG</button><button id="lg-dlSvg">Save SVG</button></div>
    <div id="lg-stat"></div>
    </div>

    <div style="color:var(--dim); margin-top:8px" id="info">—</div>
  </aside>
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="drop">drop an image — it comes back as lace</div>
    <div id="logoStage" hidden><canvas id="lg-c"></canvas></div>
  </div>

</div>

<script type="module">
// Fetched with the clock on it. A browser will otherwise hold on to lace.js
// and run it against a freshly loaded page, which presents as a change that
// silently did nothing — and costs an afternoon before anyone suspects it.
const { drawLace, drawImageLace, drawBorder, fieldRect, toGrid, drawStitches,
  drawLoose, stitchCells, toSVG, shapeField, growthField, applyRiso } =
  await import(`./lace.js?t=${Date.now()}`);

const $ = (id) => document.getElementById(id);

let logoLoaded = null;
for (const tab of document.querySelectorAll(".tabs [role=tab]")) {
  tab.addEventListener("click", () => {
    for (const t of document.querySelectorAll(".tabs [role=tab]")) {
      const on = t === tab;
      t.setAttribute("aria-selected", on);
      $(`tab-${t.dataset.tab}`).hidden = !on;
    }
    document.querySelector("aside").scrollTop = 0;
    // Motion animates whichever piece you came from
    if (tab.dataset.tab !== "motion") setTarget(tab.dataset.tab === "logo" ? "logo" : "lace");
    else showStage();
  });
}
for (const b of $("motionTarget").children) b.addEventListener("click", () => setTarget(b.dataset.target));

// The logo is a separate piece of work with its own canvas, so showing it
// swaps the stage, and puts away what only applies to the lace.
let target = "lace", logoMod = null;
async function setTarget(t) {
  if (t !== target) stopMotion();
  target = t;
  for (const b of $("motionTarget").children) b.dataset.on = String(b.dataset.target === t);
  if (t === "logo") {
    logoLoaded ??= import(`./logo.js?t=${Date.now()}`); // built the first time it is asked for
    logoMod = await logoLoaded;
  }
  showStage();
  motionRows();
}
function showStage() {
  const logo = target === "logo" && $("tab-design").hidden;
  $("logoStage").hidden = !logo;
  stage.hidden = logo;
  $("info").hidden = logo;
}

// The working palette, off the studio sheet and nothing besides — fixed
// swatches rather than a colour picker, because these are the colours the work
// is in. A grey ramp used to sit under it; greys were never on the sheet.
const PALETTE = ["#fbf4dd", "#fff278", "#86842d", "#403b12", "#2a2a2a", "#181818", "#ffffff"];
const download = (href, name) => {
  const a = document.createElement("a");
  a.download = name;
  a.href = href;
  a.click();
};
const stage = $("stage");
const ctx = stage.getContext("2d");
const src = document.createElement("canvas"); // the motif, before the grid

const S = {
  w: 1400, h: 1000, dpr: 2,
  bg: "#fbf4dd", ink: "#86842d", alpha: false,
  cols: 220, gap: 0.18, levels: 3, dither: 0.35, soft: 0.8, relief: 0, swell: 0.3, offset: 0, scatter: 0, vary: 0,
  grain: 0.2, mottle: 0.45, speckle: 0.05,
  threshold: 0.2, contrast: 1,
  seed: 20260917, symmetry: "mirror4", repeat: 4,
  stems: 5, spread: 0.38, leafiness: 0.9, medallion: 0.26, petals: 8,
  weight: 0.5, // the motif's stroke, fixed — no longer a control
  border: true, corners: true, riso: false,
  inset: 0.02, bands: 2, // the frame's own proportions, fixed
  image: null, source: "motif", invert: false, zoom: 1, read: "edges",
  motion: "branch", lag: 0, fps: 8, amount: 0.4, flare: 0.6, steps: 15, transition: "contract", seq: [],
};

let grid = null;
let seqGrids = []; // one grid per uploaded image, rebuilt only when settings change
let orders = new Map(); // per pair: the order cells change hands in a morph
let loose = null;       // the stitches as movable things, for the gather

// With no sequence loaded, a morph still has somewhere to go: the next seed.
function morphTarget() {
  return buildSource({ seed: (S.seed + 1) >>> 0 });
}

// When each cell changes hands, rather than all of them at once. Measured from
// both shapes: the outgoing one lets go at its extremities first, the incoming
// one arrives at its heart first — so the picture is taken apart and the next
// is assembled, instead of the two being faded through each other.
function changeOrder(a, b, key) {
  if (orders.has(key)) return orders.get(key);
  const ink = Math.max(0.06, S.threshold * 0.6);
  const fa = shapeField(a, { ink }).field;
  const fb = shapeField(b, { ink }).field;
  const raw = new Float32Array(fa.length);
  for (let i = 0; i < raw.length; i++) raw[i] = 0.5 * (1 - fa[i]) + 0.5 * fb[i];

  // Averaging two fields piles the values up around the middle, so nearly every
  // cell would change hands at the same moment and the whole transition would
  // pass in a frame or two. Rank them instead: each cell's turn is its position
  // in the order, which spreads the change evenly across the crossing.
  const idx = Array.from(raw.keys()).sort((a, b) => raw[a] - raw[b]);
  const o = new Float32Array(raw.length);
  for (let r = 0; r < idx.length; r++) o[idx[r]] = r / (idx.length - 1 || 1);
  orders.set(key, o);
  return o;
}

// A front sweeping across that order, with a flare on it: cells brighten as it
// passes, so stitches appear along the edge of the change rather than the whole
// field dimming and lifting.
const RAMP = 0.26, FLARE = 0.3;
function crossfade(a, b, k, key) {
  const o = changeOrder(a, b, key);
  const cells = new Float32Array(a.cells.length);
  const f = k * (1 + 2 * RAMP) - RAMP; // so every cell gets its turn
  for (let i = 0; i < cells.length; i++) {
    const d = (f - o[i]) / RAMP;
    const u = Math.max(0, Math.min(1, (d + 1) / 2));
    const e = u * u * (3 - 2 * u);
    const bump = Math.max(0, 1 - Math.abs(d));
    cells[i] = a.cells[i] + (b.cells[i] - a.cells[i]) * e + FLARE * bump * bump * S.flare;
  }
  return { cols: a.cols, rows: a.rows, cells };
}

function blend(a, b, t) {
  const cells = new Float32Array(a.cells.length);
  for (let i = 0; i < cells.length; i++)
    cells[i] = a.cells[i] + (b.cells[i] - a.cells[i]) * t;
  return { cols: a.cols, rows: a.rows, cells };
}

function build() {
  // Each image in the sequence is placed on its own — centred, whole, with no
  // mirroring or repetition. It is a series of pictures, not a pattern.
  seqGrids = S.seq.map((it) => buildSource({
    image: it.img, source: "imageLace", symmetry: "none",
    zoom: it.zoom, anchor: it.anchor,
  }));
  grid = seqGrids.length ? seqGrids[0] : buildSource();
  orders.clear(); // the morph schedules go with the grids they described
  loose = null;
  branched = null;
  pairCache.clear();
  window.__grid = grid; // dev hook, alongside __S / __build / __draw
  const rows = grid.rows;
  const usingImage = S.source !== "motif" && S.image;
  const what = seqGrids.length
    ? `${seqGrids.length} image${seqGrids.length > 1 ? "s" : ""}`
    : usingImage ? (S.source === "imageLace" ? "image laced" : "image") : `seed ${S.seed}`;
  // the page's own date, so it is obvious at a glance whether this is the
  // current build or something the browser kept
  const built = new Date(document.lastModified);
  const stamp = `${String(built.getHours()).padStart(2, "0")}:${String(built.getMinutes()).padStart(2, "0")}`;
  $("info").textContent = `${S.cols} × ${rows} stitches · ${S.symmetry} · ${what} · build ${stamp}`;
  anim.morphB = null; // the far end of a morph belongs to the seed that just changed
  draw();
}

function buildSource(over = {}) {
  const seed = over.seed ?? S.seed;
  const source = over.source ?? S.source;
  const image = over.image ?? S.image;
  const symmetry = over.symmetry ?? S.symmetry;
  const zoom = over.zoom ?? S.zoom;
  const rows = Math.max(4, Math.round((S.cols * S.h) / S.w));
  // render the motif far above grid resolution, so each cell has real coverage
  // ten render pixels per cell gives each one real coverage to average, but it
  // is capped — past this the buffer costs more than the extra detail is worth
  const RES = Math.min(3400, Math.max(1200, S.cols * 10));
  src.width = RES;
  src.height = Math.round((RES * S.h) / S.w);
  const g = src.getContext("2d", { willReadFrequently: true });
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, src.width, src.height);

  const usingImage = source !== "motif" && image;
  if (usingImage) {
    // the picture sits in the field the border encloses, not under the frame
    const f = fieldRect(src.width, src.height, S);
    g.save();
    g.beginPath();
    g.rect(f.x, f.y, f.w, f.h);
    g.clip();
    g.translate(f.x, f.y);
    if (source === "imageLace") drawImageLace(g, f.w, f.h, image, { ...S, symmetry, zoom, anchor: over.anchor });
    else {
      const img = image;
      const s = Math.max(f.w / img.width, f.h / img.height);
      g.drawImage(img, (f.w - img.width * s) / 2, (f.h - img.height * s) / 2,
        img.width * s, img.height * s);
    }
    g.restore();
    // Coverage from the picture: tone reads its light and dark, edges reads
    // where it changes. A photograph's bright masses stitch solid under tone,
    // so edges is what actually comes back as lace.
    const d = g.getImageData(0, 0, src.width, src.height);
    const p = d.data;
    let blur = null;
    if (S.read === "edges") {
      const t = document.createElement("canvas");
      t.width = src.width;
      t.height = src.height;
      const tg = t.getContext("2d", { willReadFrequently: true });
      tg.filter = `blur(${Math.max(1, src.width / 180)}px)`;
      tg.drawImage(src, 0, 0);
      blur = tg.getImageData(0, 0, src.width, src.height).data;
    }
    for (let i = 0; i < p.length; i += 4) {
      const a0 = p[i + 3] / 255;
      const lum = (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114) / 255;
      let v;
      if (blur) {
        const bl = (blur[i] * 0.299 + blur[i + 1] * 0.587 + blur[i + 2] * 0.114) / 255;
        v = Math.min(1, Math.abs(lum - bl) * 6); // difference of blurs — an edge map
      } else v = lum;
      p[i + 3] = Math.round((S.invert ? 1 - v : v) * a0 * 255);
      p[i] = p[i + 1] = p[i + 2] = 255;
    }
    g.putImageData(d, 0, 0);
    if (S.border) drawBorder(g, src.width, src.height, S);
  } else {
    drawLace(g, src.width, src.height, { ...S, seed });
  }

  return toGrid(src, S.cols, rows);
}

function drawOpts() {
  return {
    w: S.w, h: S.h, levels: S.levels, threshold: S.threshold, contrast: S.contrast,
    gap: S.gap, dither: S.dither, seed: S.seed,
  };
}

// Stitches go to their own layer and are composited through a blur when
// softness is on: feathering the layer once is a single filtered draw, where
// softening every stitch as it is drawn would not be. The ground underneath
// stays crisp.
let softLayer = null;
function stitchTarget() {
  if (!(S.soft > 0)) return ctx;
  if (!softLayer) softLayer = document.createElement("canvas");
  if (softLayer.width !== stage.width || softLayer.height !== stage.height) {
    softLayer.width = stage.width;
    softLayer.height = stage.height;
  }
  const g = softLayer.getContext("2d");
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, softLayer.width, softLayer.height);
  g.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  return g;
}
function compositeStitches(g) {
  if (g === ctx) return;
  ctx.save();
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  ctx.filter = `blur(${S.soft}px)`;
  ctx.drawImage(softLayer, 0, 0, S.w, S.h);
  ctx.restore();
}

function draw(frame = null) {
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  ctx.clearRect(0, 0, S.w, S.h);
  if (!S.alpha) {
    // transparent ground exports the lace as an overlay; opaque bakes a panel
    ctx.fillStyle = S.bg;
    ctx.fillRect(0, 0, S.w, S.h);
  }
  if (!grid) return;
  const g = stitchTarget();
  if (frame?.loose) {
    const cw = S.w / grid.cols, ch = S.h / grid.rows;
    drawLoose(g, frame.loose.items, {
      ink: S.ink, size: frame.loose.size,
      levels: frame.loose.levels, phase: frame.phase,
      cw, ch, offX: (cw - frame.loose.size) / 2, offY: (ch - frame.loose.size) / 2,
      path: S.transition === "corner" ? "manhattan" : "line",
      loosen: frame.emerge ? 1 : 0.3,
      stagger: frame.stagger ?? 0,
      emerge: !!frame.emerge, relief: S.relief, swell: S.swell,
      latePhase: frame.latePhase ?? null, lateSeed: S.seed,
      offset: S.offset * (S.w / grid.cols), offsetSeed: frame?.tick ?? 0,
      speckle: S.riso ? S.speckle : 0, speckleSeed: S.seed,
      scatter: S.scatter * (S.w / grid.cols), vary: S.vary, printSeed: S.seed,
    });
  } else {
    drawStitches(g, frame?.grid || grid, {
      w: S.w, h: S.h, ink: S.ink, levels: S.levels,
      threshold: frame?.threshold ?? S.threshold,
      contrast: S.contrast, gap: S.gap, dither: S.dither,
      seed: frame?.seed ?? S.seed, relief: S.relief, swell: S.swell,
      // sizes come from the still composition, so motion changes which stitches
      // are lit and how strongly — never how big they are
      sizeFrom: grid.cells, fade: frame?.fade || null,
      offset: S.offset * (S.w / grid.cols), offsetSeed: frame?.tick ?? 0,
      speckle: S.riso ? S.speckle : 0, speckleSeed: S.seed,
      scatter: S.scatter * (S.w / grid.cols), vary: S.vary, printSeed: S.seed,
    });
  }
  compositeStitches(g);
  // the press laid it down unevenly and the paper took it unevenly: both go
  // over the whole panel, ink and ground alike
  if (S.riso) {
    applyRiso(ctx, S.w, S.h, {
      grain: S.grain, mottle: S.mottle, seed: S.seed, scale: 1 / S.dpr,
    });
  }
}

// Motion works on the grid, never on the motif: re-running the vector work per
// frame would cost 35ms a frame at 120 columns and far more above that, while
// the stitches redraw in a few. What moves is which cells clear the threshold.
let anim = { on: false, raf: 0, beat: 0, last: 0, tick: 0, morphB: null };

function morphGrid(t) {
  return crossfade(grid, anim.morphB, t, "seed");
}

// One picture's stitches, matched to the next picture's. The two rarely have
// the same number of them, so whichever is short is padded with points just
// outside the frame: surplus stitches walk out of shot, new ones walk in. Both
// ends stay exactly their own arrangement, which they would not if the extras
// were parked somewhere inside the panel.
const pairCache = new Map();
function loosePair(i) {
  const j = (i + 1) % seqGrids.length;
  const key = `${i}>${j}|${S.cols}|${S.levels}|${S.gap}|${S.threshold}|${S.contrast}|${S.dither}|${S.seed}|${S.transition}|${S.w}x${S.h}`;
  if (pairCache.has(key)) return pairCache.get(key);

  const A = stitchCells(seqGrids[i], drawOpts());
  const B = stitchCells(seqGrids[j], drawOpts());
  const flat = (set) => {
    const out = [];
    for (let l = 1; l <= set.levels; l++) for (const p of set.byLevel[l]) out.push([p[0], p[1], l, p[2]]);
    return out;
  };
  const a = flat(A), b = flat(B);
  const n = Math.max(a.length, b.length);
  const rim = (k) => { // a point just outside the frame, spread around it
    const u = (k * 2.399963) % (Math.PI * 2);
    return [S.w / 2 + Math.cos(u) * S.w * 0.75, S.h / 2 + Math.sin(u) * S.h * 0.75];
  };
  while (a.length < n) { const r = rim(a.length); a.push([r[0], r[1], b[a.length][2], b[a.length][3]]); }
  while (b.length < n) { const r = rim(b.length + 7919); b.push([r[0], r[1], a[b.length][2], a[b.length][3]]); }

  const ORDER = 8, SIDE = 1 << ORDER;
  const hilbert = (px, py) => {
    let x = Math.max(0, Math.min(SIDE - 1, Math.floor((px / S.w) * SIDE)));
    let y = Math.max(0, Math.min(SIDE - 1, Math.floor((py / S.h) * SIDE)));
    let d = 0;
    for (let sN = SIDE / 2; sN > 0; sN /= 2) {
      const rx = (x & sN) > 0 ? 1 : 0, ry = (y & sN) > 0 ? 1 : 0;
      d += sN * sN * ((3 * rx) ^ ry);
      if (ry === 0) { if (rx === 1) { x = sN - 1 - x; y = sN - 1 - y; } const t = x; x = y; y = t; }
    }
    return d;
  };
  const rnd = (() => { let z = 0x1234567 ^ S.seed; return () => (z = (z * 1664525 + 1013904223) >>> 0) / 4294967296; })();
  const orderOf = (list) => {
    const idx = list.map((_, k) => k);
    if (S.transition === "swap") { // paired at random, for comparison
      for (let k = idx.length - 1; k > 0; k--) { const m = Math.floor(rnd() * (k + 1)); [idx[k], idx[m]] = [idx[m], idx[k]]; }
      return idx;
    }
    return idx.sort((p, q) => hilbert(list[p][0], list[p][1]) - hilbert(list[q][0], list[q][1]));
  };
  const oa = orderOf(a), ob = orderOf(b);
  const items = [];
  for (let k = 0; k < n; k++) {
    const from = a[oa[k]], to = b[ob[k]];
    items.push({ sx: from[0], sy: from[1], tx: to[0], ty: to[1], level: to[2], w: to[3], delay: 0, x: to[0], y: to[1] });
  }
  const out = { key, items, size: B.size, levels: B.levels };
  pairCache.set(key, out);
  return out;
}

// For the branch: each stitch's turn comes from how far it lies through the
// shape, and it emerges from whichever neighbouring cell lies closer to the
// heart — which is what makes an arm extend along itself.
let branched = null;
function branchStitches() {
  const key = [S.cols, S.levels, S.gap, S.threshold, S.contrast, S.dither, S.seed,
    S.w, S.h].join("|");
  if (branched && branched.key === key) return branched;
  const { byLevel, size, levels } = stitchCells(grid, drawOpts());
  const { cols, rows } = grid;
  // When growth spreading through the ink would reach each cell, against how
  // far out the cell simply lies. On the spread alone a cell sitting in slow
  // ground near the middle can be reached after one far out, so the order
  // stops being outward at all — it expands and then fills back in towards the
  // centre. Weighted towards distance, it stays an outward growth, and the
  // spread is what makes its edge ragged rather than a ring.
  // Three things decide when a cell's turn comes, and it takes all three.
  // Plain distance out from the middle is the only one that guarantees the
  // growth reads as outward: measured through the shape instead, an arm that
  // loops back can be a long way round while sitting close to the centre, and
  // the run expands and then fills back in behind itself. Distance through the
  // shape keeps it following the arms rather than sweeping a circle over them,
  // and the spread is what leaves the edge ragged instead of a ring.
  const ink = Math.max(0.06, S.threshold * 0.6);
  const along = shapeField(grid, { ink }).field;
  const spread = growthField(grid, { ink, seed: S.seed, roughness: 1 }).field;
  const fld = new Float32Array(along.length);
  {
    const midX = (cols - 1) / 2, midY = (rows - 1) / 2;
    const maxR = Math.hypot(midX, midY) || 1;
    for (let ry = 0; ry < rows; ry++) {
      for (let rx = 0; rx < cols; rx++) {
        const i = ry * cols + rx;
        const radial = Math.hypot(rx - midX, ry - midY) / maxR;
        fld[i] = radial * 0.5 + along[i] * 0.25 + spread[i] * 0.25;
      }
    }
  }
  const cw = S.w / cols, ch = S.h / rows;
  const items = [];
  for (let l = 1; l <= levels; l++) {
    for (const cell of byLevel[l]) {
      const [tx, ty] = cell;
      const rx = Math.min(cols - 1, Math.max(0, Math.floor(tx / cw)));
      const ry = Math.min(rows - 1, Math.max(0, Math.floor(ty / ch)));
      const here = fld[ry * cols + rx];
      let bx = 0, by = 0, best = here;
      for (let oy = -1; oy <= 1; oy++) {
        for (let ox = -1; ox <= 1; ox++) {
          if (!ox && !oy) continue;
          const nx = rx + ox, ny = ry + oy;
          if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
          const v = fld[ny * cols + nx];
          if (v < best) { best = v; bx = ox; by = oy; }
        }
      }
      items.push({
        tx, ty, level: l, w: cell[2],
        sx: tx + bx * cw * 1.1, sy: ty + by * ch * 1.1,
        delay: Math.max(0, Math.min(1, here)),
        x: tx, y: ty,
      });
    }
  }
  branched = { key, items, size, levels };
  window.__branched = branched;
  return branched;
}

// The stitches of the still composition, each given somewhere to come in from
// and a turn to do it: out along its own bearing from the middle, and sooner
// the closer it lies to the heart of the shape, so the pattern assembles from
// its core outward rather than arriving all at once.
function looseStitches() {
  const key = [S.cols, S.levels, S.gap, S.threshold, S.contrast, S.dither, S.seed,
    S.w, S.h, S.transition].join("|");
  if (loose && loose.key === key) return loose;
  const { byLevel, size, levels } = stitchCells(grid, drawOpts());
  const fld = shapeField(grid, { ink: Math.max(0.06, S.threshold * 0.6) }).field;
  const cw = S.w / grid.cols, ch = S.h / grid.rows;
  const cx = S.w / 2, cy = S.h / 2;

  const rnd = (() => { let a = 0x9e3779b9 ^ S.seed; return () => (a = (a * 1664525 + 1013904223) >>> 0) / 4294967296; })();
  const items = [];
  for (let l = 1; l <= levels; l++) {
    for (const cell of byLevel[l]) {
      const [tx, ty] = cell;
      const rx = Math.min(grid.cols - 1, Math.max(0, Math.floor(tx / cw)));
      const ry = Math.min(grid.rows - 1, Math.max(0, Math.floor(ty / ch)));
      items.push({
        tx, ty, level: l, w: cell[2],
        sx: tx, sy: ty,
        delay: Math.min(1, fld[ry * grid.cols + rx] * 0.8 + 0.1),
        x: tx, y: ty, a: 1,
      });
    }
  }

  // The dispersed state is a plain grid across the panel, evenly spaced, with
  // the short last row centred — scattering them at random read as noise rather
  // than as the same stitches waiting to be arranged.
  const n = items.length;
  const gc = Math.max(1, Math.round(Math.sqrt(n * (S.w / S.h))));
  const gr = Math.max(1, Math.ceil(n / gc));
  const stepX = S.w / gc, stepY = S.h / gr;
  const slots = [];
  for (let r = 0; r < gr; r++) {
    const inRow = Math.min(gc, n - r * gc);
    if (inRow <= 0) break;
    const pad = (gc - inRow) / 2; // centre a short final row
    for (let c = 0; c < inRow; c++) {
      slots.push([(c + pad + 0.5) * stepX - size / 2, (r + 0.5) * stepY - size / 2]);
    }
  }

  // Where they wait, and which one waits where, is the whole character of the
  // transition — the travelling is the same straight walk in every case.
  const kind = S.transition;
  if (kind === "fall" || kind === "edges") {
    for (const it of items) {
      if (kind === "fall") {
        it.sx = it.tx;
        // columns start at staggered heights, so it does not drop in lockstep
        it.sy = it.ty - S.h * (0.35 + (Math.floor(it.tx / cw) % 3) * 0.22);
      } else {
        const left = it.tx < S.w / 2;
        it.sx = left ? it.tx - S.w * 0.55 : it.tx + S.w * 0.55;
        it.sy = it.ty;
      }
    }
    loose = { key, items, size, levels };
    window.__loose = loose;
    return loose;
  }

  if (kind === "swap") { // no pairing at all, for comparison
    const shuffled = slots.slice();
    for (let i = shuffled.length - 1; i > 0; i--) {
      const j = Math.floor(rnd() * (i + 1));
      [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
    }
    items.forEach((it, i) => {
      const slot = shuffled[i] || shuffled[shuffled.length - 1];
      it.sx = slot[0];
      it.sy = slot[1];
    });
    loose = { key, items, size, levels };
    window.__loose = loose;
    return loose;
  }

  if (kind === "settle") {
    // each takes the closest slot still going — the least movement that still
    // uses every slot, so the grid barely has to break up at all
    const taken = new Uint8Array(slots.length);
    for (const it of items) {
      let best = -1, bd = Infinity;
      for (let i = 0; i < slots.length; i++) {
        if (taken[i]) continue;
        const dx = slots[i][0] - it.tx, dy = slots[i][1] - it.ty, d = dx * dx + dy * dy;
        if (d < bd) { bd = d; best = i; }
      }
      if (best < 0) break;
      taken[best] = 1;
      it.sx = slots[best][0];
      it.sy = slots[best][1];
    }
    loose = { key, items, size, levels };
    window.__loose = loose;
    return loose;
  }

  // Pair them along a Hilbert curve: it runs through two dimensions without
  // ever favouring a direction, so neighbouring slots feed neighbouring
  // targets and the set contracts evenly. Ordering both lists by angle instead
  // put a systematic twist between them — every stitch handed to a slot a
  // little further round than the last — and the whole thing wound in like a
  // spiral.
  const ORDER = 8, SIDE = 1 << ORDER;
  const hilbert = (px, py) => {
    let x = Math.max(0, Math.min(SIDE - 1, Math.floor((px / S.w) * SIDE)));
    let y = Math.max(0, Math.min(SIDE - 1, Math.floor((py / S.h) * SIDE)));
    let d = 0;
    for (let sN = SIDE / 2; sN > 0; sN /= 2) {
      const rx = (x & sN) > 0 ? 1 : 0;
      const ry = (y & sN) > 0 ? 1 : 0;
      d += sN * sN * ((3 * rx) ^ ry);
      if (ry === 0) {
        if (rx === 1) { x = sN - 1 - x; y = sN - 1 - y; }
        const t = x; x = y; y = t;
      }
    }
    return d;
  };
  const order = items.map((it, i) => i)
    .sort((a, b) => hilbert(items[a].tx, items[a].ty) - hilbert(items[b].tx, items[b].ty));
  slots.sort((a, b) => hilbert(a[0], a[1]) - hilbert(b[0], b[1]));
  order.forEach((idx, k) => {
    const slot = slots[k] || slots[slots.length - 1];
    items[idx].sx = slot[0];
    items[idx].sy = slot[1];
  });

  loose = { key, items, size, levels };
  window.__loose = loose; // dev hook
  return loose;
}

// A travelling field added to the coverage, so different parts of the pattern
// cross the threshold at different moments and stitches march along its arms.
// A single global threshold only made the whole thing fade in and out at once.
// The dither seed is held still throughout on purpose — a moving seed sparkles,
// a fixed one lets blocks step from cell to cell, which is what reads as motion.
// fn is handed each cell's own coverage, so what moves is keyed to the pattern
// rather than to the canvas it sits on
function waveFrame(t, fn) {
  const { cols, rows, cells } = grid;
  const out = new Float32Array(cells.length);
  for (let i = 0; i < cells.length; i++) out[i] = cells[i] + fn(cells[i], t, i);
  return { grid: { cols, rows, cells: out } };
}

function frameAt(n) {
  const f = frameFor(n);
  // every frame carries its own tick, so the offset re-rolls as it plays
  return f ? { ...f, tick: n } : (S.offset > 0 ? { tick: n } : null);
}

// Offset is in seconds, so it holds its length when the frame rate changes
const lagFrames = () => Math.round(S.lag * Math.max(1, S.fps));
// only the motions that walk stitches in have a second wave to hold back
function motionRows() {
  // the logo is a single piece, so there is no series for it to morph through
  const logo = target === "logo";
  const morph = $("motion").querySelector('[value="morph"]');
  morph.hidden = morph.disabled = logo;
  if (logo && S.motion === "morph") { S.motion = "branch"; $("motion").value = "branch"; amountLabel(); }
  for (const id of ["flareRow", "morphRow", "seqList"]) $(id).hidden = logo;
  $("lagRow").hidden = S.motion !== "branch" && S.motion !== "gather";
}

function frameFor(n) {
  const amt = S.amount;
  // seconds, not frames — so fps changes how choppy it is, not how fast
  const t = n / Math.max(1, S.fps);
  switch (S.motion) {
    case "breathe": {
      // Random stitches fading in and out, and nothing else: same cells, same
      // sizes, same places. Amount is how many of them take part — the rest
      // hold at full.
      //
      // One clock each is not enough on its own. Every stitch swinging the same
      // range at much the same speed reads as a single motion wearing a lot of
      // dots, so each also gets its own depth, its own speed over a wide range,
      // and its own curve: a high exponent lingers dark and dips briefly, a low
      // one sits bright and only occasionally drops.
      const share = Math.max(0.02, amt);
      const r = (i, k) => (Math.imul(i + k, 2246822519 ^ Math.imul(k, 374761393)) >>> 0) / 4294967296;
      return {
        fade: (i) => {
          if (r(i, 1) > share) return 1; // this one sits it out
          const ph = r(i, 7) * Math.PI * 2;
          const rate = 0.25 + Math.pow(r(i, 13), 2) * 2.6;  // mostly slow, a few quick
          const depth = 0.25 + Math.pow(r(i, 23), 1.4) * 0.72; // how far down it goes
          const curve = 0.45 + Math.pow(r(i, 31), 1.6) * 2.8;  // and how it gets there
          const w = Math.pow(0.5 + 0.5 * Math.sin(t * rate + ph), curve);
          return 1 - depth * (1 - w);
        },
      };
    }
    case "branch": {
      // Growth rather than arrival: each stitch takes its turn by how far it
      // lies through the shape from the heart, and comes out of whichever
      // neighbouring cell lies closer in — so a branch extends along itself
      // instead of every stitch sliding in from one direction.
      // Grows and then stays: what has grown is not taken back, so the symbol
      // is there to look at rather than passing through. Amount is how long it
      // holds before starting over.
      const steps = Math.max(2, Math.round(S.steps));
      const hold = Math.max(1, Math.round((0.5 + amt * 6) * S.fps));
      const lag = lagFrames();
      const cycle = steps + lag + hold;
      const k = ((n % cycle) + cycle) % cycle;
      const at = (j) => Math.max(0, Math.min(steps, j)) / steps;
      return { loose: branchStitches(), phase: at(k), latePhase: lag ? at(k - lag) : null,
        emerge: true, stagger: 0.85 };
    }
    case "gather": {
      // Counted in frames rather than seconds: one step per frame, so Steps is
      // exactly how many stages there are and each one is a legible position.
      // Frames per second sets how long each is held.
      const steps = Math.max(2, Math.round(S.steps));
      const hold = Math.max(1, Math.round((0.4 + amt * 3) * S.fps));
      // Eased a little, so the steps close up towards each end rather than
      // arriving at full stride. Short late steps are not lost to the lattice —
      // drawLoose eases off it over the last of the run.
      const shape = (step) => {
        const u = step / steps;
        return 1 - Math.pow(1 - u, 1.55);
      };

      if (seqGrids.length > 1) {
        // A series walks one picture's stitches into the next and on to the
        // one after, so each leg is a journey and a hold — there is nothing to
        // come back out to, the way there is with a single pattern.
        const lag = lagFrames();
        const leg = steps + lag + hold;
        const total = leg * seqGrids.length;
        const k = ((n % total) + total) % total;
        const i = Math.floor(k / leg);
        const at = (j) => shape(Math.max(0, Math.min(steps, j)));
        return { loose: loosePair(i), phase: at(k % leg), latePhase: lag ? at(k % leg - lag) : null };
      }

      const g = looseStitches();
      // With an offset the run in is longer by it, and the run out is the run
      // in played backwards: the late ones leave first.
      const lag = lagFrames();
      const run = steps + lag;
      const cycle = run * 2 + hold * 2;
      const k = ((n % cycle) + cycle) % cycle;
      let j;
      if (k < run) j = k;                                  // closing in
      else if (k < run + hold) j = run;                    // arranged
      else if (k < run * 2 + hold) j = run - (k - run - hold); // opening out
      else j = 0;                                          // back in the grid
      const at = (x) => shape(Math.max(0, Math.min(steps, x)));
      return { loose: g, phase: at(j), latePhase: lag ? at(j - lag) : null };
    }
    case "weight": // ordered by how solid each part of the pattern already is
      return waveFrame(t, (cov, tt) => Math.sin(tt * 2 - cov * 7) * amt * 0.3);
    case "morph": {
      if (seqGrids.length > 1) {
        // walk the series: each image holds, then dissolves into the next
        const per = 0.4 + S.amount * 3; // Amount is the hold, in seconds
        const span = seqGrids.length * per;
        const u = ((t % span) + span) % span;
        const i = Math.floor(u / per);
        const f = (u % per) / per;
        const k = Math.max(0, Math.min(1, (f - 0.3) / 0.45)); // hold, then cross
        const j = (i + 1) % seqGrids.length;
        return { grid: crossfade(seqGrids[i], seqGrids[j], k, `${i}>${j}`) };
      }
      if (seqGrids.length === 1) return null; // nothing to cross to yet
      // built on demand, not only when playback starts
      if (!anim.morphB) anim.morphB = morphTarget();
      const period = Math.max(2, Math.round(S.fps * 2));
      const p = (n % period) / period;
      return { grid: morphGrid(p < 0.5 ? p * 2 : 2 - p * 2) };
    }
    default:
      return null;
  }
}

function stopMotion() {
  anim.on = false;
  cancelAnimationFrame(anim.raf);
  $("play").dataset.on = "false";
  $("play").textContent = "Play";
  if (target === "logo") logoMod?.still();
  else draw();
}

function startMotion() {
  if (target === "logo" ? !logoMod : !grid) return;
  anim.on = true;
  anim.beat = 0;
  anim.last = performance.now();
  $("play").dataset.on = "true";
  $("play").textContent = "Stop";
  const step = (now) => {
    if (!anim.on) return;
    anim.raf = requestAnimationFrame(step);
    if (now - anim.last < 1000 / S.fps) return; // hold each frame — it is stop motion
    anim.last = now;
    if (target === "logo") logoMod.frame(anim.beat++, S);
    else draw(frameAt(anim.beat++));
  };
  anim.raf = requestAnimationFrame(step);
}

function resize() {
  stage.width = S.w * S.dpr;
  stage.height = S.h * S.dpr;
  stage.style.width = S.w + "px";
  stage.style.height = S.h + "px";
  fit();
}
function fit() {
  const box = $("stageWrap").getBoundingClientRect();
  const s = Math.min((box.width - 32) / S.w, (box.height - 32) / S.h);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit);
new ResizeObserver(fit).observe($("stageWrap"));

// grid/ink params only need a redraw; motif params need the motif again
const f2 = (v) => v.toFixed(2);
const SLIDERS = [
  ["fps", "fps", true], ["amount", "amount", true, f2], ["flare", "flare", true, f2],
  ["steps", "steps", true], ["lag", "lag", true, (v) => v.toFixed(2) + "s"],
  ["cols", "cols", false], ["gap", "gap", true, f2], 
  ["soft", "soft", true, f2], ["swell", "swell", true, f2],
  ["scatter", "scatter", true, f2],
  ["vary", "vary", true, f2],
  ["grain", "grain", true, f2], ["mottle", "mottle", true, f2],
  ["speckle", "speckle", true, f2],
  ["dither", "dither", true, f2], ["threshold", "threshold", true, f2],
  ["contrast", "contrast", true, (v) => v.toFixed(1)],
  ["stems", "stems", false], ["spread", "spread", false, f2],
  ["leafiness", "leafiness", false, f2],
  ["medallion", "medallion", false, f2], ["petals", "petals", false],

  ["repeat", "repeat", false], ["zoom", "zoom", false, (v) => v.toFixed(2) + "×"],
];
const bind = ([id, key, redrawOnly = false, fmt = (v) => v]) => {
  const el = $(id), out = $("v-" + id);
  const apply = () => {
    S[key] = +el.value;
    if (out) out.textContent = fmt(S[key]);
    // while it is playing the next frame redraws anyway
    if (!redrawOnly) build();
    else if (!anim.on) draw();
    writeHash();
  };
  el.addEventListener("input", apply);
  if (out) out.textContent = fmt(S[key]);
};
SLIDERS.forEach(bind);

// write the state back into the controls (after a shuffle, or a link)
function syncControls() {
  for (const [id, key, , fmt = (v) => v] of SLIDERS) {
    const el = $(id), out = $("v-" + id);
    if (el) el.value = S[key];
    if (out) out.textContent = fmt(S[key]);
  }
  $("seed").value = S.seed;
  $("symmetry").value = S.symmetry;
  $("source").value = S.source;
  $("read").value = S.read;
  $("motion").value = S.motion;
  $("transition").value = S.transition;
  amountLabel();
  markSwatches();
  sourceRows();
  motionRows();
  for (const [id, key] of [["invert", "invert"]]) $(id).dataset.on = String(S[key]);
  $("cornersSw").checked = !!S.corners;
  $("borderSw").checked = !!S.border;
  $("risoSw").checked = !!S.riso;
  stage.classList.toggle("alpha", S.alpha);
}

// a seed is only worth having if you can get back to it
const HASH_KEYS = ["seed", "symmetry", "repeat", "source", "invert", "zoom", "read", "motion", "lag", "fps", "amount", "flare", "steps", "transition", "stems", "spread", "leafiness",
  "medallion", "petals", "cols", "gap", "dither", "threshold",
  "contrast", "border", "corners", "riso", "bg", "ink", "alpha", "w", "h", "soft", "swell", "scatter", "vary", "grain", "mottle", "speckle"];
let hashLock = false;
function writeHash() {
  if (hashLock) return;
  const q = new URLSearchParams();
  for (const k of HASH_KEYS) q.set(k, String(S[k]));
  history.replaceState(null, "", "#" + q.toString());
}
function readHash() {
  if (!location.hash.length) return false;
  const q = new URLSearchParams(location.hash.slice(1));
  let any = false;
  for (const k of HASH_KEYS) {
    if (!q.has(k)) continue;
    const v = q.get(k);
    const cur = S[k];
    S[k] = typeof cur === "number" ? +v : typeof cur === "boolean" ? v === "true" : v;
    any = true;
  }
  return any;
}
// Only the controls that act on what is being stitched: the branch and
// medallion sliders do nothing to a picture, and the picture's own settings
// nothing to the motif. Symmetry and zoom only reach a picture when it is laced.
function sourceRows() {
  const image = S.source !== "motif" && !!S.image;
  for (const el of document.querySelectorAll("[data-for]"))
    el.hidden = el.dataset.for !== (image ? "image" : "motif");
  const flat = image && S.source === "image";
  $("symmetryRow").hidden = flat;
  $("repeatRow").hidden = flat || S.symmetry !== "tile";
  $("zoomRow").hidden = !image || flat;
}
$("source").addEventListener("change", (e) => {
  S.source = e.target.value;
  if (S.source !== "motif" && !S.image) $("file").click();
  else build();
  sourceRows();
  writeHash();
});
$("read").addEventListener("change", (e) => { S.read = e.target.value; build(); writeHash(); });
// Amount means different things per mode, so the label says which
function amountLabel() {
  $("amountLabel").innerHTML = S.motion === "morph"
    ? `Hold each <b id="v-amount">${(0.4 + S.amount * 3).toFixed(1)}s</b>`
    : `Amount <b id="v-amount">${S.amount.toFixed(2)}</b>`;
}
$("amount").addEventListener("input", amountLabel);
$("transition").addEventListener("change", (e) => {
  S.transition = e.target.value;
  loose = null; // the starting positions are what changes
  if (!anim.on && target === "logo") S.motion === "gather" ? logoMod.frame(0, S) : logoMod.still();
  else if (!anim.on) draw(S.motion === "gather" ? frameAt(0) : null);
  writeHash();
});
$("motion").addEventListener("change", (e) => {
  S.motion = e.target.value;
  motionRows();
  amountLabel();
  stopMotion();
  startMotion();
  writeHash();
});
$("play").addEventListener("click", () => (anim.on ? stopMotion() : startMotion()));
$("record").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  if (!anim.on) startMotion();
  const logo = target === "logo";
  const stream = (logo ? logoMod.canvas : stage).captureStream(Math.max(S.fps, 12));
  // mp4 first — it is what the social apps take without converting
  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mimeType = types.find((t) => MediaRecorder.isTypeSupported(t));
  if (!mimeType) return alert("This browser will not record a canvas.");
  const rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12e6 });
  const chunks = [];
  rec.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
  rec.onstop = () => {
    const ext = mimeType.includes("mp4") ? "mp4" : "webm";
    const url = URL.createObjectURL(new Blob(chunks, { type: mimeType }));
    download(url, logo ? `${logoMod.recordingName()}.${ext}` : `pixel-lace-${S.w}x${S.h}.${ext}`);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    btn.textContent = "Record 5s";
    btn.dataset.on = "false";
  };
  btn.textContent = "Recording…";
  btn.dataset.on = "true";
  rec.start();
  setTimeout(() => rec.stop(), 5000);
});
$("upload").addEventListener("click", () => $("file").click());
$("morphImg").addEventListener("click", () => $("fileB").click());
// Uploads come in at every size and crop, so each one is measured: the ground
// is read from the corners, the subject is what differs from it, and the zoom
// and anchor that put that subject in the frame are worked out from its bounds.
// Without it a series jumps in scale from image to image.
function fitItem(it) {
  const N = 220;
  const c = document.createElement("canvas");
  const s = Math.min(N / it.img.width, N / it.img.height);
  c.width = Math.max(1, Math.round(it.img.width * s));
  c.height = Math.max(1, Math.round(it.img.height * s));
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(it.img, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const lum = (i) => (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
  const corners = [
    0, (c.width - 1) * 4, (c.height - 1) * c.width * 4,
    ((c.height - 1) * c.width + c.width - 1) * 4,
  ].map(lum);
  const ground = corners.reduce((a, b) => a + b, 0) / corners.length;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (Math.abs(lum((y * c.width + x) * 4) - ground) < 0.12) continue;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) { it.zoom = 1; it.anchor = [0.5, 0.5]; return; }
  const bw = (x1 - x0 + 1) / c.width, bh = (y1 - y0 + 1) / c.height;
  // zoom is relative to the contain fit, so 1 is the whole picture in frame
  it.zoom = Math.min(3, Math.max(0.4, 0.88 / Math.max(bw, bh)));
  it.anchor = [(x0 + x1 + 1) / 2 / c.width, (y0 + y1 + 1) / 2 / c.height];
}

function renderSeq() {
  const host = $("seqList");
  host.innerHTML = "";
  S.seq.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "seqrow";
    const thumb = document.createElement("canvas");
    thumb.width = 68;
    thumb.height = 52;
    const tg = thumb.getContext("2d");
    const sc = Math.max(68 / it.img.width, 52 / it.img.height);
    tg.drawImage(it.img, (68 - it.img.width * sc) / 2, (52 - it.img.height * sc) / 2,
      it.img.width * sc, it.img.height * sc);
    const zoom = document.createElement("input");
    zoom.type = "range";
    zoom.min = 0.4;
    zoom.max = 3;
    zoom.step = 0.05;
    zoom.value = it.zoom;
    const val = document.createElement("b");
    val.textContent = it.zoom.toFixed(2) + "×";
    zoom.addEventListener("input", () => {
      it.zoom = +zoom.value;
      val.textContent = it.zoom.toFixed(2) + "×";
      // only this one's grid changes
      seqGrids[i] = buildSource({
        image: it.img, source: "imageLace", symmetry: "none",
        zoom: it.zoom, anchor: it.anchor,
      });
      if (!anim.on) draw(S.motion === "morph" ? { grid: seqGrids[i] } : null);
    });
    const del = document.createElement("button");
    del.textContent = "×";
    del.addEventListener("click", () => {
      S.seq.splice(i, 1);
      renderSeq();
      seqLabel();
      build();
    });
    row.append(thumb, zoom, val, del);
    host.appendChild(row);
  });
}

function seqLabel() {
  const n = S.seq.length;
  $("morphImg").dataset.on = String(n > 0);
  $("morphImg").textContent = n ? `${n} image${n > 1 ? "s" : ""} — add more…` : "Add images…";
}
$("fileB").addEventListener("change", async (e) => {
  const files = [...e.target.files].filter((f) => f.type.startsWith("image/"));
  if (!files.length) return;
  // keep the order they were picked in — it is a sequence
  for (const f of files) {
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.src = url;
    try { await img.decode(); } catch { continue; }
    URL.revokeObjectURL(url);
    const it = { img, zoom: 1, anchor: [0.5, 0.5] };
    fitItem(it); // standardise on the way in
    S.seq.push(it);
  }
  e.target.value = "";
  renderSeq();
  seqLabel();
  if (S.motion !== "morph") { S.motion = "morph"; $("motion").value = "morph"; motionRows(); }
  build();
  stopMotion();
  if (S.seq.length > 1) startMotion();
});
$("fitAll").addEventListener("click", () => {
  S.seq.forEach(fitItem);
  renderSeq();
  build();
});
$("clearMorphImg").addEventListener("click", () => {
  S.seq = [];
  renderSeq();
  anim.morphB = null;
  seqLabel();
  stopMotion();
  build();
});
$("file").addEventListener("change", (e) => e.target.files[0] && loadImage(e.target.files[0]));
$("symmetry").addEventListener("change", (e) => {
  S.symmetry = e.target.value;
  sourceRows();
  build();
  writeHash();
});
const setSeed = (v) => { S.seed = v >>> 0; $("seed").value = S.seed; build(); writeHash(); };
$("seed").addEventListener("input", (e) => { S.seed = (+e.target.value || 0) >>> 0; build(); writeHash(); });
$("seedDown").addEventListener("click", () => setSeed(S.seed - 1));
$("seedUp").addEventListener("click", () => setSeed(S.seed + 1));
// Transparent is a ground like any other, so it is chosen like one: a checked
// swatch at the end of the background row, rather than a separate switch.
function clearSwatch(onPick) {
  const b = document.createElement("button");
  b.className = "clear";
  b.title = "Transparent";
  b.setAttribute("aria-label", "Transparent");
  b.addEventListener("click", onPick);
  return b;
}
function buildSwatches(hostId, key) {
  const host = $(hostId);
  host.innerHTML = "";
  for (const hex of PALETTE) {
    const b = document.createElement("button");
    b.style.background = hex;
    b.title = hex.toUpperCase();
    b.dataset.hex = hex;
    b.addEventListener("click", () => {
      S[key] = hex;
      if (key === "bg") { S.alpha = false; stage.classList.remove("alpha"); }
      markSwatches();
      draw();
      writeHash();
    });
    host.appendChild(b);
  }
  if (key === "bg") host.appendChild(clearSwatch(() => {
    S.alpha = true;
    stage.classList.add("alpha");
    markSwatches();
    draw();
    writeHash();
  }));
}
function markSwatches() {
  for (const [hostId, key] of [["bgSw", "bg"], ["inkSw", "ink"]]) {
    const clear = key === "bg" && S.alpha;
    const cur = String(S[key]).toLowerCase();
    for (const b of $(hostId).children)
      b.dataset.on = String(b.classList.contains("clear") ? clear : !clear && b.dataset.hex === cur);
    const out = $("v-" + key);
    if (out) out.textContent = clear ? "Transparent" : cur.toUpperCase();
  }
}
buildSwatches("bgSw", "bg");
buildSwatches("inkSw", "ink");
// aspect shown as a ratio, so a custom size can be checked at a glance
function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function setSize(w, h) {
  S.w = Math.max(200, Math.min(4000, Math.round(w)));
  S.h = Math.max(200, Math.min(4000, Math.round(h)));
  $("pw").value = S.w;
  $("ph").value = S.h;
  const g = gcd(S.w, S.h);
  $("v-ar").textContent = `${S.w / g}:${S.h / g}`;
  const match = [...$("preset").options].find((o) => o.value === `${S.w}x${S.h}`);
  $("preset").value = match ? match.value : "custom";
  resize();
  build();
  writeHash();
}
$("preset").addEventListener("change", (e) => {
  if (e.target.value === "custom") return $("pw").focus();
  const [w, h] = e.target.value.split("x").map(Number);
  setSize(w, h);
});
// change, not input: a number field fires on every keystroke and a half-typed
// width would rebuild the whole grid
for (const id of ["pw", "ph"])
  $(id).addEventListener("change", () => setSize(+$("pw").value, +$("ph").value));
$("shuffle").addEventListener("click", () => setSeed((Math.random() * 1e9) | 0));
$("borderSw").addEventListener("change", (e) => {
  S.border = e.target.checked;
  build(); // the frame is part of the motif, so the grid is remade
  writeHash();
});
$("cornersSw").addEventListener("change", (e) => {
  S.corners = e.target.checked;
  build();
  writeHash();
});
$("risoSw").addEventListener("change", (e) => {
  // the sliders keep their values; this only decides whether they are applied
  S.riso = e.target.checked;
  draw();
  writeHash();
});
const toggle = (id, key) => $(id).addEventListener("click", (e) => {
  S[key] = e.currentTarget.dataset.on !== "true";
  e.currentTarget.dataset.on = String(S[key]);
  build();
  writeHash();
});
toggle("invert", "invert");
$("save").addEventListener("click", () =>
  download(stage.toDataURL("image/png"), `pixel-lace-${stage.width}x${stage.height}.png`));
$("saveSvg").addEventListener("click", () => {
  if (!grid) return;
  const svg = toSVG(grid, {
    w: S.w, h: S.h, ink: S.ink, levels: S.levels, threshold: S.threshold,
    contrast: S.contrast, gap: S.gap, dither: S.dither, seed: S.seed,
    swell: S.swell, scatter: S.scatter * (S.w / grid.cols), vary: S.vary,
    printSeed: S.seed, offset: S.offset * (S.w / grid.cols), offsetSeed: 0,
    speckle: S.riso ? S.speckle : 0, speckleSeed: S.seed,
    // match what is on screen: the ground unless it is transparent, the
    // relief, and the softness as a blur of the same radius
    bg: S.alpha ? null : S.bg, relief: S.relief, soft: S.soft,
  });
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  download(url, `pixel-lace-${S.w}x${S.h}.svg`);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    S.image = img;
    if (S.source === "motif") S.source = "imageLace"; // laced is the interesting one
    $("source").value = S.source;
    sourceRows();
    URL.revokeObjectURL(url);
    build();
    writeHash();
  };
  img.src = url;
}
const dropEl = $("drop");
addEventListener("dragover", (e) => { e.preventDefault(); dropEl.classList.add("on"); });
addEventListener("dragleave", () => dropEl.classList.remove("on"));
addEventListener("drop", (e) => {
  e.preventDefault();
  dropEl.classList.remove("on");
  const f = e.dataTransfer.files[0];
  if (!f || !f.type.startsWith("image/")) return;
  if ($("tab-logo").hidden) loadImage(f);
  else { // on the Logo tab, it is artwork for the particles
    const input = $("lg-imgFile"), dt = new DataTransfer();
    dt.items.add(f);
    input.files = dt.files;
    input.dispatchEvent(new Event("change"));
  }
});

hashLock = true;
readHash();
// Still is simply not playing, so it is no longer a motion of its own; links
// made when it was come back on the default.
if (S.motion === "none") S.motion = "branch";
syncControls();
hashLock = false;
setSize(S.w, S.h); // also resizes, builds and records the aspect
window.__S = S;
window.__build = build;
window.__draw = draw;
window.__frameAt = frameAt; // dev hook: render a given motion frame directly
</script>
</body>
</html>
