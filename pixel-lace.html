<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leroy — pixel lace</title>
  <style>
    :root { --pane: #0e1113; --line: #23292c; --txt: #c9d3d6; --dim: #79878c; --hi: #2fe36a; }
    html, body { margin: 0; height: 100%; background: #0a0d0e; color: var(--txt);
      font: 12px/1.45 system-ui, sans-serif; overflow: hidden; }
    #wrap { display: flex; height: 100%; }
    #stageWrap { flex: 1; overflow: hidden; position: relative; }
    #stage { position: absolute; left: 50%; top: 50%; transform-origin: 50% 50%;
      box-shadow: 0 20px 60px rgba(0,0,0,.55); }
    #stage.alpha {
      background-image:
        linear-gradient(45deg, #1a1f22 25%, transparent 25%, transparent 75%, #1a1f22 75%),
        linear-gradient(45deg, #1a1f22 25%, transparent 25%, transparent 75%, #1a1f22 75%);
      background-size: 24px 24px;
      background-position: 0 0, 12px 12px;
      background-color: #12171a;
    }
    #drop { position: absolute; inset: 0; display: grid; place-items: center; pointer-events: none;
      color: var(--dim); opacity: 0; transition: opacity .15s; font-size: 14px; }
    #drop.on { opacity: 1; background: rgba(10,13,14,.75); }

    aside { width: 290px; border-left: 1px solid var(--line); background: var(--pane);
      overflow-y: auto; padding: 14px; }
    h2 { margin: 18px 0 8px; font-size: 10px; letter-spacing: .1em; text-transform: uppercase;
      color: var(--dim); font-weight: 500; }
    h2:first-child { margin-top: 0; }
    label { display: block; margin-bottom: 8px; }
    label > span { display: flex; justify-content: space-between; color: var(--dim); margin-bottom: 2px; }
    label > span b { color: var(--txt); font-weight: 500; font-variant-numeric: tabular-nums; }
    input[type=range] { width: 100%; accent-color: var(--hi); }
    select { width: 100%; box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line);
      border-radius: 6px; background: #0a0d0e; color: var(--txt); font: inherit; }
    input[type=number] { box-sizing: border-box; padding: 5px 7px; border: 1px solid var(--line);
      border-radius: 6px; background: #0a0d0e; color: var(--txt); font: inherit; }
    input[type=color] { width: 100%; height: 26px; padding: 0; border: 1px solid var(--line);
      border-radius: 6px; background: #0a0d0e; }
    .row { display: flex; gap: 6px; }
    .row > * { flex: 1; }
    button { padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px;
      background: transparent; color: var(--txt); cursor: pointer; font: inherit; }
    button:hover { border-color: var(--hi); color: var(--hi); }
    button[data-on="true"] { background: var(--hi); border-color: var(--hi); color: #06120a; }
    .mini { display: flex; gap: 6px; }
    .mini label { flex: 1; }
    .seqrow { display: flex; gap: 6px; align-items: center; margin-top: 6px; }
    .seqrow canvas { width: 34px; height: 26px; object-fit: cover; border: 1px solid var(--line);
      border-radius: 4px; background: #000; flex: 0 0 auto; }
    .seqrow input { flex: 1; }
    .seqrow button { flex: 0 0 auto; padding: 2px 6px; color: var(--dim); }
    .seqrow b { flex: 0 0 34px; text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
  </style>
</head>
<body>
<div id="wrap">
  <div id="stageWrap">
    <canvas id="stage"></canvas>
    <div id="drop">drop an image — it comes back as lace</div>
  </div>

  <aside>
    <h2>Panel</h2>
    <label><select id="preset">
      <option value="1080x1350">1080 × 1350 — portrait 4:5</option>
      <option value="1080x1920">1080 × 1920 — story 9:16</option>
      <option value="1080x1080">1080 × 1080 — square</option>
      <option value="1200x1500">1200 × 1500 — portrait 4:5 large</option>
      <option value="1200x630">1200 × 630 — link preview</option>
      <option value="1920x1080">1920 × 1080 — landscape 16:9</option>
      <option value="1400x1000">1400 × 1000 — landscape panel</option>
      <option value="1350x1800">1350 × 1800 — 18 × 24 print</option>
      <option value="custom">custom…</option>
    </select></label>
    <div class="mini">
      <label><span>Width <b id="v-ar"></b></span>
        <input type="number" id="pw" min="200" max="4000" step="10" value="1400" /></label>
      <label><span>Height</span>
        <input type="number" id="ph" min="200" max="4000" step="10" value="1000" /></label>
    </div>
    <div class="row">
      <label><span>Ground</span><input type="color" id="bg" value="#fbf4dd" /></label>
      <label><span>Thread</span><input type="color" id="ink" value="#86842d" /></label>
    </div>
    <button id="alphaBtn" style="width:100%">Transparent ground</button>

    <h2>Grid</h2>
    <label><span>Columns <b id="v-cols"></b></span>
      <input id="cols" type="range" min="24" max="400" step="2" value="120" /></label>
    <label><span>Gap <b id="v-gap"></b></span>
      <input id="gap" type="range" min="0" max="0.6" step="0.02" value="0.18" /></label>
    <label><span>Levels <b id="v-levels"></b></span>
      <input id="levels" type="range" min="1" max="5" step="1" value="3" /></label>
    <label><span>Dither <b id="v-dither"></b></span>
      <input id="dither" type="range" min="0" max="1" step="0.05" value="0.35" /></label>
    <label><select id="shape">
      <option value="square">square stitch</option>
      <option value="dot">round stitch</option>
      <option value="cross">cross stitch</option>
    </select></label>

    <h2>Ink</h2>
    <label><span>Threshold <b id="v-threshold"></b></span>
      <input id="threshold" type="range" min="0.02" max="0.95" step="0.01" value="0.2" /></label>
    <label><span>Contrast <b id="v-contrast"></b></span>
      <input id="contrast" type="range" min="0.4" max="4" step="0.1" value="1" /></label>

    <h2>Motif</h2>
    <label><span>Seed</span>
      <div class="row">
        <button id="seedDown" style="flex:0 0 32px">◀</button>
        <input type="number" id="seed" value="20260917" style="flex:1; text-align:center" />
        <button id="seedUp" style="flex:0 0 32px">▶</button>
      </div>
    </label>
    <div class="row"><button id="shuffle">Shuffle</button><button id="copyLink">Copy link</button></div>
    <label style="margin-top:8px"><span>Symmetry</span><select id="symmetry">
      <option value="mirror4">mirrored — both axes</option>
      <option value="none">none — a single spray</option>
      <option value="mirrorX">mirrored — one axis</option>
      <option value="rot4">turned — four-fold</option>
      <option value="kaleido8">kaleidoscope — eight</option>
      <option value="tile">half-drop repeat</option>
    </select></label>
    <label id="repeatRow" style="display:none"><span>Repeat <b id="v-repeat"></b></span>
      <input id="repeat" type="range" min="2" max="10" step="1" value="4" /></label>
    <label style="margin-top:8px"><span>Source</span><select id="source">
      <option value="motif">generated motif</option>
      <option value="imageLace">image — laced</option>
      <option value="image">image — flat</option>
    </select></label>
    <div class="row">
      <button id="upload">Upload image…</button>
      <button id="invert" data-on="false">Invert</button>
    </div>
    <label style="margin-top:8px"><span>Read as</span><select id="read">
      <option value="edges">edges — linework</option>
      <option value="tone">tone — light and dark</option>
    </select></label>
    <label><span>Image zoom <b id="v-zoom"></b></span>
      <input id="zoom" type="range" min="0.4" max="3" step="0.05" value="1" /></label>
    <input type="file" id="file" accept="image/*" hidden />
    <label style="margin-top:8px"><span>Stems <b id="v-stems"></b></span>
      <input id="stems" type="range" min="1" max="9" step="1" value="5" /></label>
    <label><span>Spread <b id="v-spread"></b></span>
      <input id="spread" type="range" min="0" max="1" step="0.02" value="0.38" /></label>
    <label><span>Leafiness <b id="v-leafiness"></b></span>
      <input id="leafiness" type="range" min="0" max="2" step="0.05" value="0.9" /></label>
    <label><span>Weight <b id="v-weight"></b></span>
      <input id="weight" type="range" min="0.2" max="3" step="0.1" value="0.6" /></label>
    <label><span>Medallion <b id="v-medallion"></b></span>
      <input id="medallion" type="range" min="0" max="0.7" step="0.02" value="0.26" /></label>
    <label><span>Petals <b id="v-petals"></b></span>
      <input id="petals" type="range" min="3" max="16" step="1" value="8" /></label>

    <h2>Border</h2>
    <div class="row">
      <button id="borderBtn" data-on="true">Border</button>
      <button id="cornersBtn" data-on="true">Corners</button>
    </div>
    <div class="mini" style="margin-top:8px">
      <label><span>Inset <b id="v-inset"></b></span>
        <input id="inset" type="range" min="0.01" max="0.16" step="0.005" value="0.05" /></label>
      <label><span>Bands <b id="v-bands"></b></span>
        <input id="bands" type="range" min="1" max="4" step="1" value="2" /></label>
    </div>

    <h2>Motion</h2>
    <label><select id="motion">
      <option value="none">still</option>
      <option value="grow">grow — out along its own arms, then back</option>
      <option value="pulse">pulse — bands travel through the form</option>
      <option value="weight">weight — the faint parts go first, the dense last</option>
      <option value="breathe">breathe — opens and closes as one</option>
      <option value="morph">morph — one image into the next</option>
    </select></label>
    <label><span>Frames per second <b id="v-fps"></b></span>
      <input id="fps" type="range" min="2" max="24" step="1" value="8" /></label>
    <label><span id="amountLabel">Amount <b id="v-amount"></b></span>
      <input id="amount" type="range" min="0.05" max="1" step="0.05" value="0.4" /></label>
    <div class="row">
      <button id="morphImg">Add images…</button>
      <button id="fitAll">Fit each</button>
      <button id="clearMorphImg">Clear</button>
    </div>
    <input type="file" id="fileB" accept="image/*" multiple hidden />
    <div id="seqList"></div>
    <div class="row" style="margin-top:6px">
      <button id="play">Play</button>
      <button id="record">Record 5s</button>
    </div>

    <h2>Output</h2>
    <div class="row"><button id="save">Save PNG</button><button id="saveSvg">Save SVG</button></div>
    <div style="color:var(--dim); margin-top:8px" id="info">—</div>
  </aside>
</div>

<script type="module">
import { drawLace, drawImageLace, drawBorder, fieldRect, toGrid, drawStitches, toSVG, shapeField } from "./lace.js";

const $ = (id) => document.getElementById(id);
const download = (href, name) => {
  const a = document.createElement("a");
  a.download = name;
  a.href = href;
  a.click();
};
const stage = $("stage");
const ctx = stage.getContext("2d");
const src = document.createElement("canvas"); // the motif, before the grid

const S = {
  w: 1400, h: 1000, dpr: 2,
  bg: "#fbf4dd", ink: "#86842d", alpha: false,
  cols: 120, gap: 0.18, levels: 3, dither: 0.35, shape: "square",
  threshold: 0.2, contrast: 1,
  seed: 20260917, symmetry: "mirror4", repeat: 4,
  stems: 5, spread: 0.38, leafiness: 0.9, weight: 0.6, medallion: 0.26, petals: 8,
  border: true, corners: true, inset: 0.05, bands: 2,
  image: null, source: "motif", invert: false, zoom: 1, read: "edges",
  motion: "none", fps: 8, amount: 0.4, seq: [],
};

let grid = null;
let field = null;  // distance through the shape, for motion that follows it
let seqGrids = []; // one grid per uploaded image, rebuilt only when settings change

// With no sequence loaded, a morph still has somewhere to go: the next seed.
function morphTarget() {
  return buildSource({ seed: (S.seed + 1) >>> 0 });
}

function blend(a, b, t) {
  const cells = new Float32Array(a.cells.length);
  for (let i = 0; i < cells.length; i++)
    cells[i] = a.cells[i] + (b.cells[i] - a.cells[i]) * t;
  return { cols: a.cols, rows: a.rows, cells };
}

function build() {
  // Each image in the sequence is placed on its own — centred, whole, with no
  // mirroring or repetition. It is a series of pictures, not a pattern.
  seqGrids = S.seq.map((it) => buildSource({
    image: it.img, source: "imageLace", symmetry: "none",
    zoom: it.zoom, anchor: it.anchor,
  }));
  grid = seqGrids.length ? seqGrids[0] : buildSource();
  field = null; // measured on demand — only the shape-led modes need it
  window.__grid = grid; // dev hook, alongside __S / __build / __draw
  const rows = grid.rows;
  const usingImage = S.source !== "motif" && S.image;
  const what = seqGrids.length
    ? `${seqGrids.length} image${seqGrids.length > 1 ? "s" : ""}`
    : usingImage ? (S.source === "imageLace" ? "image laced" : "image") : `seed ${S.seed}`;
  $("info").textContent = `${S.cols} × ${rows} stitches · ${S.symmetry} · ${what}`;
  anim.morphB = null; // the far end of a morph belongs to the seed that just changed
  draw();
}

function buildSource(over = {}) {
  const seed = over.seed ?? S.seed;
  const source = over.source ?? S.source;
  const image = over.image ?? S.image;
  const symmetry = over.symmetry ?? S.symmetry;
  const zoom = over.zoom ?? S.zoom;
  const rows = Math.max(4, Math.round((S.cols * S.h) / S.w));
  // render the motif far above grid resolution, so each cell has real coverage
  // ten render pixels per cell gives each one real coverage to average, but it
  // is capped — past this the buffer costs more than the extra detail is worth
  const RES = Math.min(3400, Math.max(1200, S.cols * 10));
  src.width = RES;
  src.height = Math.round((RES * S.h) / S.w);
  const g = src.getContext("2d", { willReadFrequently: true });
  g.setTransform(1, 0, 0, 1, 0, 0);
  g.clearRect(0, 0, src.width, src.height);

  const usingImage = source !== "motif" && image;
  if (usingImage) {
    // the picture sits in the field the border encloses, not under the frame
    const f = fieldRect(src.width, src.height, S);
    g.save();
    g.beginPath();
    g.rect(f.x, f.y, f.w, f.h);
    g.clip();
    g.translate(f.x, f.y);
    if (source === "imageLace") drawImageLace(g, f.w, f.h, image, { ...S, symmetry, zoom, anchor: over.anchor });
    else {
      const img = image;
      const s = Math.max(f.w / img.width, f.h / img.height);
      g.drawImage(img, (f.w - img.width * s) / 2, (f.h - img.height * s) / 2,
        img.width * s, img.height * s);
    }
    g.restore();
    // Coverage from the picture: tone reads its light and dark, edges reads
    // where it changes. A photograph's bright masses stitch solid under tone,
    // so edges is what actually comes back as lace.
    const d = g.getImageData(0, 0, src.width, src.height);
    const p = d.data;
    let blur = null;
    if (S.read === "edges") {
      const t = document.createElement("canvas");
      t.width = src.width;
      t.height = src.height;
      const tg = t.getContext("2d", { willReadFrequently: true });
      tg.filter = `blur(${Math.max(1, src.width / 180)}px)`;
      tg.drawImage(src, 0, 0);
      blur = tg.getImageData(0, 0, src.width, src.height).data;
    }
    for (let i = 0; i < p.length; i += 4) {
      const a0 = p[i + 3] / 255;
      const lum = (p[i] * 0.299 + p[i + 1] * 0.587 + p[i + 2] * 0.114) / 255;
      let v;
      if (blur) {
        const bl = (blur[i] * 0.299 + blur[i + 1] * 0.587 + blur[i + 2] * 0.114) / 255;
        v = Math.min(1, Math.abs(lum - bl) * 6); // difference of blurs — an edge map
      } else v = lum;
      p[i + 3] = Math.round((S.invert ? 1 - v : v) * a0 * 255);
      p[i] = p[i + 1] = p[i + 2] = 255;
    }
    g.putImageData(d, 0, 0);
    if (S.border) drawBorder(g, src.width, src.height, S);
  } else {
    drawLace(g, src.width, src.height, { ...S, seed });
  }

  return toGrid(src, S.cols, rows);
}

function draw(frame = null) {
  ctx.setTransform(S.dpr, 0, 0, S.dpr, 0, 0);
  ctx.clearRect(0, 0, S.w, S.h);
  if (!S.alpha) {
    // transparent ground exports the lace as an overlay; opaque bakes a panel
    ctx.fillStyle = S.bg;
    ctx.fillRect(0, 0, S.w, S.h);
  }
  if (!grid) return;
  drawStitches(ctx, frame?.grid || grid, {
    w: S.w, h: S.h, ink: S.ink, levels: S.levels,
    threshold: frame?.threshold ?? S.threshold,
    contrast: S.contrast, gap: S.gap, shape: S.shape, dither: S.dither,
    seed: frame?.seed ?? S.seed,
  });
}

// Motion works on the grid, never on the motif: re-running the vector work per
// frame would cost 35ms a frame at 120 columns and far more above that, while
// the stitches redraw in a few. What moves is which cells clear the threshold.
let anim = { on: false, raf: 0, beat: 0, last: 0, tick: 0, morphB: null };

function morphGrid(t) {
  const e = t * t * (3 - 2 * t);
  return blend(grid, anim.morphB, e);
}

// A travelling field added to the coverage, so different parts of the pattern
// cross the threshold at different moments and stitches march along its arms.
// A single global threshold only made the whole thing fade in and out at once.
// The dither seed is held still throughout on purpose — a moving seed sparkles,
// a fixed one lets blocks step from cell to cell, which is what reads as motion.
// fn is handed each cell's own coverage and its distance through the shape, so
// what moves is keyed to the pattern rather than to the canvas it sits on
function waveFrame(t, fn) {
  const { cols, rows, cells } = grid;
  if (!field) field = shapeField(grid, { ink: Math.max(0.06, S.threshold * 0.6) }).field;
  const out = new Float32Array(cells.length);
  for (let i = 0; i < cells.length; i++) out[i] = cells[i] + fn(field[i], cells[i], t);
  return { grid: { cols, rows, cells: out } };
}

function frameAt(n) {
  const amt = S.amount;
  // seconds, not frames — so fps changes how choppy it is, not how fast
  const t = n / Math.max(1, S.fps);
  switch (S.motion) {
    case "breathe":
      return waveFrame(t, (g, cov, t) => Math.sin(t * 2.2) * amt * 0.22);
    case "grow":
      // a front running out along the shape from its heart, and back
      return waveFrame(t, (g, cov, t) => {
        const front = (Math.sin(t * 1.4) * 0.5 + 0.5) * 1.2;
        return Math.tanh((front - g) * 5) * amt * 0.34;
      });
    case "pulse": // bands following the same route, one after another
      return waveFrame(t, (g, cov, t) => Math.sin(g * 16 - t * 3.2) * amt * 0.3);
    case "weight": // ordered by how solid each part of the pattern already is
      return waveFrame(t, (g, cov, t) => Math.sin(t * 2 - cov * 7) * amt * 0.3);
    case "morph": {
      if (seqGrids.length > 1) {
        // walk the series: each image holds, then dissolves into the next
        const per = 0.4 + S.amount * 3; // Amount is the hold, in seconds
        const span = seqGrids.length * per;
        const u = ((t % span) + span) % span;
        const i = Math.floor(u / per);
        const f = (u % per) / per;
        const k = Math.max(0, Math.min(1, (f - 0.3) / 0.45)); // hold, then cross
        return {
          grid: blend(seqGrids[i], seqGrids[(i + 1) % seqGrids.length], k * k * (3 - 2 * k)),
        };
      }
      if (seqGrids.length === 1) return null; // nothing to cross to yet
      // built on demand, not only when playback starts
      if (!anim.morphB) anim.morphB = morphTarget();
      const period = Math.max(2, Math.round(S.fps * 2));
      const p = (n % period) / period;
      return { grid: morphGrid(p < 0.5 ? p * 2 : 2 - p * 2) };
    }
    default:
      return null;
  }
}

function stopMotion() {
  anim.on = false;
  cancelAnimationFrame(anim.raf);
  $("play").dataset.on = "false";
  $("play").textContent = "Play";
  draw();
}

function startMotion() {
  if (S.motion === "none" || !grid) return;
  anim.on = true;
  anim.beat = 0;
  anim.last = performance.now();
  $("play").dataset.on = "true";
  $("play").textContent = "Stop";
  const step = (now) => {
    if (!anim.on) return;
    anim.raf = requestAnimationFrame(step);
    if (now - anim.last < 1000 / S.fps) return; // hold each frame — it is stop motion
    anim.last = now;
    draw(frameAt(anim.beat++));
  };
  anim.raf = requestAnimationFrame(step);
}

function resize() {
  stage.width = S.w * S.dpr;
  stage.height = S.h * S.dpr;
  stage.style.width = S.w + "px";
  stage.style.height = S.h + "px";
  fit();
}
function fit() {
  const box = $("stageWrap").getBoundingClientRect();
  const s = Math.min((box.width - 32) / S.w, (box.height - 32) / S.h);
  stage.style.transform = `translate(-50%, -50%) scale(${s})`;
}
addEventListener("resize", fit);
new ResizeObserver(fit).observe($("stageWrap"));

// grid/ink params only need a redraw; motif params need the motif again
const f2 = (v) => v.toFixed(2);
const SLIDERS = [
  ["fps", "fps", true], ["amount", "amount", true, f2],
  ["cols", "cols", false], ["gap", "gap", true, f2], ["levels", "levels", true],
  ["dither", "dither", true, f2], ["threshold", "threshold", true, f2],
  ["contrast", "contrast", true, (v) => v.toFixed(1)],
  ["stems", "stems", false], ["spread", "spread", false, f2],
  ["leafiness", "leafiness", false, f2], ["weight", "weight", false, (v) => v.toFixed(1)],
  ["medallion", "medallion", false, f2], ["petals", "petals", false],
  ["inset", "inset", false, (v) => v.toFixed(3)], ["bands", "bands", false],
  ["repeat", "repeat", false], ["zoom", "zoom", false, (v) => v.toFixed(2) + "×"],
];
const bind = ([id, key, redrawOnly = false, fmt = (v) => v]) => {
  const el = $(id), out = $("v-" + id);
  const apply = () => {
    S[key] = +el.value;
    if (out) out.textContent = fmt(S[key]);
    // while it is playing the next frame redraws anyway
    if (!redrawOnly) build();
    else if (!anim.on) draw();
    writeHash();
  };
  el.addEventListener("input", apply);
  if (out) out.textContent = fmt(S[key]);
};
SLIDERS.forEach(bind);

// write the state back into the controls (after a shuffle, or a link)
function syncControls() {
  for (const [id, key, , fmt = (v) => v] of SLIDERS) {
    const el = $(id), out = $("v-" + id);
    if (el) el.value = S[key];
    if (out) out.textContent = fmt(S[key]);
  }
  $("seed").value = S.seed;
  $("symmetry").value = S.symmetry;
  $("source").value = S.source;
  $("read").value = S.read;
  $("motion").value = S.motion;
  amountLabel();
  $("shape").value = S.shape;
  $("bg").value = S.bg;
  $("ink").value = S.ink;
  $("repeatRow").style.display = S.symmetry === "tile" ? "block" : "none";
  for (const [id, key] of [["borderBtn", "border"], ["cornersBtn", "corners"],
    ["alphaBtn", "alpha"], ["invert", "invert"]]) $(id).dataset.on = String(S[key]);
  stage.classList.toggle("alpha", S.alpha);
}

// a seed is only worth having if you can get back to it
const HASH_KEYS = ["seed", "symmetry", "repeat", "source", "invert", "zoom", "read", "motion", "fps", "amount", "stems", "spread", "leafiness", "weight",
  "medallion", "petals", "cols", "gap", "levels", "dither", "shape", "threshold",
  "contrast", "border", "corners", "inset", "bands", "bg", "ink", "alpha", "w", "h"];
let hashLock = false;
function writeHash() {
  if (hashLock) return;
  const q = new URLSearchParams();
  for (const k of HASH_KEYS) q.set(k, String(S[k]));
  history.replaceState(null, "", "#" + q.toString());
}
function readHash() {
  if (!location.hash.length) return false;
  const q = new URLSearchParams(location.hash.slice(1));
  let any = false;
  for (const k of HASH_KEYS) {
    if (!q.has(k)) continue;
    const v = q.get(k);
    const cur = S[k];
    S[k] = typeof cur === "number" ? +v : typeof cur === "boolean" ? v === "true" : v;
    any = true;
  }
  return any;
}
$("shape").addEventListener("change", (e) => { S.shape = e.target.value; draw(); writeHash(); });
$("source").addEventListener("change", (e) => {
  S.source = e.target.value;
  if (S.source !== "motif" && !S.image) $("file").click();
  else build();
  writeHash();
});
$("read").addEventListener("change", (e) => { S.read = e.target.value; build(); writeHash(); });
// Amount means different things per mode, so the label says which
function amountLabel() {
  $("amountLabel").innerHTML = S.motion === "morph"
    ? `Hold each <b id="v-amount">${(0.4 + S.amount * 3).toFixed(1)}s</b>`
    : `Amount <b id="v-amount">${S.amount.toFixed(2)}</b>`;
}
$("amount").addEventListener("input", amountLabel);
$("motion").addEventListener("change", (e) => {
  S.motion = e.target.value;
  amountLabel();
  stopMotion();
  if (S.motion !== "none") startMotion();
  writeHash();
});
$("play").addEventListener("click", () => (anim.on ? stopMotion() : startMotion()));
$("record").addEventListener("click", async (e) => {
  const btn = e.currentTarget;
  if (S.motion === "none") { S.motion = "ripple"; $("motion").value = "ripple"; }
  if (!anim.on) startMotion();
  const stream = stage.captureStream(Math.max(S.fps, 12));
  // mp4 first — it is what the social apps take without converting
  const types = ["video/mp4;codecs=avc1", "video/mp4", "video/webm;codecs=vp9", "video/webm"];
  const mimeType = types.find((t) => MediaRecorder.isTypeSupported(t));
  if (!mimeType) return alert("This browser will not record a canvas.");
  const rec = new MediaRecorder(stream, { mimeType, videoBitsPerSecond: 12e6 });
  const chunks = [];
  rec.ondataavailable = (ev) => ev.data.size && chunks.push(ev.data);
  rec.onstop = () => {
    const ext = mimeType.includes("mp4") ? "mp4" : "webm";
    const url = URL.createObjectURL(new Blob(chunks, { type: mimeType }));
    download(url, `pixel-lace-${S.w}x${S.h}.${ext}`);
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    btn.textContent = "Record 5s";
    btn.dataset.on = "false";
  };
  btn.textContent = "Recording…";
  btn.dataset.on = "true";
  rec.start();
  setTimeout(() => rec.stop(), 5000);
});
$("upload").addEventListener("click", () => $("file").click());
$("morphImg").addEventListener("click", () => $("fileB").click());
// Uploads come in at every size and crop, so each one is measured: the ground
// is read from the corners, the subject is what differs from it, and the zoom
// and anchor that put that subject in the frame are worked out from its bounds.
// Without it a series jumps in scale from image to image.
function fitItem(it) {
  const N = 220;
  const c = document.createElement("canvas");
  const s = Math.min(N / it.img.width, N / it.img.height);
  c.width = Math.max(1, Math.round(it.img.width * s));
  c.height = Math.max(1, Math.round(it.img.height * s));
  const g = c.getContext("2d", { willReadFrequently: true });
  g.drawImage(it.img, 0, 0, c.width, c.height);
  const d = g.getImageData(0, 0, c.width, c.height).data;
  const lum = (i) => (d[i] * 0.299 + d[i + 1] * 0.587 + d[i + 2] * 0.114) / 255;
  const corners = [
    0, (c.width - 1) * 4, (c.height - 1) * c.width * 4,
    ((c.height - 1) * c.width + c.width - 1) * 4,
  ].map(lum);
  const ground = corners.reduce((a, b) => a + b, 0) / corners.length;
  let x0 = c.width, y0 = c.height, x1 = -1, y1 = -1;
  for (let y = 0; y < c.height; y++) {
    for (let x = 0; x < c.width; x++) {
      if (Math.abs(lum((y * c.width + x) * 4) - ground) < 0.12) continue;
      if (x < x0) x0 = x;
      if (x > x1) x1 = x;
      if (y < y0) y0 = y;
      if (y > y1) y1 = y;
    }
  }
  if (x1 < 0) { it.zoom = 1; it.anchor = [0.5, 0.5]; return; }
  const bw = (x1 - x0 + 1) / c.width, bh = (y1 - y0 + 1) / c.height;
  // zoom is relative to the contain fit, so 1 is the whole picture in frame
  it.zoom = Math.min(3, Math.max(0.4, 0.88 / Math.max(bw, bh)));
  it.anchor = [(x0 + x1 + 1) / 2 / c.width, (y0 + y1 + 1) / 2 / c.height];
}

function renderSeq() {
  const host = $("seqList");
  host.innerHTML = "";
  S.seq.forEach((it, i) => {
    const row = document.createElement("div");
    row.className = "seqrow";
    const thumb = document.createElement("canvas");
    thumb.width = 68;
    thumb.height = 52;
    const tg = thumb.getContext("2d");
    const sc = Math.max(68 / it.img.width, 52 / it.img.height);
    tg.drawImage(it.img, (68 - it.img.width * sc) / 2, (52 - it.img.height * sc) / 2,
      it.img.width * sc, it.img.height * sc);
    const zoom = document.createElement("input");
    zoom.type = "range";
    zoom.min = 0.4;
    zoom.max = 3;
    zoom.step = 0.05;
    zoom.value = it.zoom;
    const val = document.createElement("b");
    val.textContent = it.zoom.toFixed(2) + "×";
    zoom.addEventListener("input", () => {
      it.zoom = +zoom.value;
      val.textContent = it.zoom.toFixed(2) + "×";
      // only this one's grid changes
      seqGrids[i] = buildSource({
        image: it.img, source: "imageLace", symmetry: "none",
        zoom: it.zoom, anchor: it.anchor,
      });
      if (!anim.on) draw(S.motion === "morph" ? { grid: seqGrids[i] } : null);
    });
    const del = document.createElement("button");
    del.textContent = "×";
    del.addEventListener("click", () => {
      S.seq.splice(i, 1);
      renderSeq();
      seqLabel();
      build();
    });
    row.append(thumb, zoom, val, del);
    host.appendChild(row);
  });
}

function seqLabel() {
  const n = S.seq.length;
  $("morphImg").dataset.on = String(n > 0);
  $("morphImg").textContent = n ? `${n} image${n > 1 ? "s" : ""} — add more…` : "Add images…";
}
$("fileB").addEventListener("change", async (e) => {
  const files = [...e.target.files].filter((f) => f.type.startsWith("image/"));
  if (!files.length) return;
  // keep the order they were picked in — it is a sequence
  for (const f of files) {
    const url = URL.createObjectURL(f);
    const img = new Image();
    img.src = url;
    try { await img.decode(); } catch { continue; }
    URL.revokeObjectURL(url);
    const it = { img, zoom: 1, anchor: [0.5, 0.5] };
    fitItem(it); // standardise on the way in
    S.seq.push(it);
  }
  e.target.value = "";
  renderSeq();
  seqLabel();
  if (S.motion !== "morph") { S.motion = "morph"; $("motion").value = "morph"; }
  build();
  stopMotion();
  if (S.seq.length > 1) startMotion();
});
$("fitAll").addEventListener("click", () => {
  S.seq.forEach(fitItem);
  renderSeq();
  build();
});
$("clearMorphImg").addEventListener("click", () => {
  S.seq = [];
  renderSeq();
  anim.morphB = null;
  seqLabel();
  stopMotion();
  build();
});
$("file").addEventListener("change", (e) => e.target.files[0] && loadImage(e.target.files[0]));
$("symmetry").addEventListener("change", (e) => {
  S.symmetry = e.target.value;
  $("repeatRow").style.display = S.symmetry === "tile" ? "block" : "none";
  build();
  writeHash();
});
const setSeed = (v) => { S.seed = v >>> 0; $("seed").value = S.seed; build(); writeHash(); };
$("seed").addEventListener("input", (e) => { S.seed = (+e.target.value || 0) >>> 0; build(); writeHash(); });
$("seedDown").addEventListener("click", () => setSeed(S.seed - 1));
$("seedUp").addEventListener("click", () => setSeed(S.seed + 1));
$("copyLink").addEventListener("click", async (e) => {
  writeHash();
  try {
    await navigator.clipboard.writeText(location.href);
    const b = e.currentTarget, t = b.textContent;
    b.textContent = "Copied";
    setTimeout(() => (b.textContent = t), 1200);
  } catch { /* clipboard blocked — the URL bar has it either way */ }
});
$("bg").addEventListener("input", (e) => { S.bg = e.target.value; draw(); writeHash(); });
$("ink").addEventListener("input", (e) => { S.ink = e.target.value; draw(); writeHash(); });
// aspect shown as a ratio, so a custom size can be checked at a glance
function gcd(a, b) { return b ? gcd(b, a % b) : a; }
function setSize(w, h) {
  S.w = Math.max(200, Math.min(4000, Math.round(w)));
  S.h = Math.max(200, Math.min(4000, Math.round(h)));
  $("pw").value = S.w;
  $("ph").value = S.h;
  const g = gcd(S.w, S.h);
  $("v-ar").textContent = `${S.w / g}:${S.h / g}`;
  const match = [...$("preset").options].find((o) => o.value === `${S.w}x${S.h}`);
  $("preset").value = match ? match.value : "custom";
  resize();
  build();
  writeHash();
}
$("preset").addEventListener("change", (e) => {
  if (e.target.value === "custom") return $("pw").focus();
  const [w, h] = e.target.value.split("x").map(Number);
  setSize(w, h);
});
// change, not input: a number field fires on every keystroke and a half-typed
// width would rebuild the whole grid
for (const id of ["pw", "ph"])
  $(id).addEventListener("change", () => setSize(+$("pw").value, +$("ph").value));
$("shuffle").addEventListener("click", () => setSeed((Math.random() * 1e9) | 0));
$("alphaBtn").addEventListener("click", (e) => {
  S.alpha = e.currentTarget.dataset.on !== "true";
  e.currentTarget.dataset.on = String(S.alpha);
  stage.classList.toggle("alpha", S.alpha);
  draw();
  writeHash();
});
const toggle = (id, key) => $(id).addEventListener("click", (e) => {
  S[key] = e.currentTarget.dataset.on !== "true";
  e.currentTarget.dataset.on = String(S[key]);
  build();
  writeHash();
});
toggle("borderBtn", "border");
toggle("cornersBtn", "corners");
toggle("invert", "invert");
$("save").addEventListener("click", () =>
  download(stage.toDataURL("image/png"), `pixel-lace-${stage.width}x${stage.height}.png`));
$("saveSvg").addEventListener("click", () => {
  if (!grid) return;
  const svg = toSVG(grid, {
    w: S.w, h: S.h, ink: S.ink, levels: S.levels, threshold: S.threshold,
    contrast: S.contrast, gap: S.gap, shape: S.shape, dither: S.dither, seed: S.seed,
  });
  const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
  download(url, `pixel-lace-${S.w}x${S.h}.svg`);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
});

function loadImage(file) {
  const url = URL.createObjectURL(file);
  const img = new Image();
  img.onload = () => {
    S.image = img;
    if (S.source === "motif") S.source = "imageLace"; // laced is the interesting one
    $("source").value = S.source;
    URL.revokeObjectURL(url);
    build();
    writeHash();
  };
  img.src = url;
}
const dropEl = $("drop");
addEventListener("dragover", (e) => { e.preventDefault(); dropEl.classList.add("on"); });
addEventListener("dragleave", () => dropEl.classList.remove("on"));
addEventListener("drop", (e) => {
  e.preventDefault();
  dropEl.classList.remove("on");
  const f = e.dataTransfer.files[0];
  if (f && f.type.startsWith("image/")) loadImage(f);
});

hashLock = true;
readHash();
syncControls();
hashLock = false;
setSize(S.w, S.h); // also resizes, builds and records the aspect
window.__S = S;
window.__build = build;
window.__draw = draw;
window.__frameAt = frameAt; // dev hook: render a given motion frame directly
</script>
</body>
</html>
