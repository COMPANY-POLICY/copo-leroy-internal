<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Leroy — 18 × 24 border</title>
  <style>
    :root { --ground: #0d1a1c; --ink: #d8ff12; }
    html, body {
      margin: 0; height: 100%; background: #0a0f10; overflow: hidden;
      font: 12px/1.4 system-ui, sans-serif; color: #7f8c8b;
    }
    #fit { position: fixed; inset: 0; overflow: hidden; }
    /* 18 × 24 inches at 75px/in — scaled to fit the window, printed at 2× */
    #stage {
      position: absolute; left: 50%; top: 50%; width: 1350px; height: 1800px;
      background:
        radial-gradient(120% 90% at 50% 0%, #17292b 0%, var(--ground) 55%, #081214 100%);
      transform-origin: 50% 50%; box-shadow: 0 30px 80px rgba(0,0,0,.6);
    }
    #leroy { position: absolute; inset: 0; width: 100%; height: 100%; cursor: crosshair; }

    .panel {
      position: fixed; top: 14px; right: 14px; display: flex; gap: 6px; align-items: center;
      padding: 8px; border: 1px solid #1f3234; border-radius: 9px; background: rgba(8,16,17,.85);
    }
    .panel button {
      padding: 6px 10px; border: 1px solid #294042; border-radius: 6px;
      background: transparent; color: #cfe3d6; cursor: pointer; font: inherit;
    }
    .panel button:hover { border-color: var(--ink); color: var(--ink); }
    .panel span { padding: 0 4px; font-variant-numeric: tabular-nums; }
    .hint { position: fixed; left: 14px; bottom: 12px; }
  </style>
</head>
<body>
  <div id="fit"><div id="stage"><canvas id="leroy"></canvas></div></div>

  <div class="panel">
    <button id="redraw">Redraw</button>
    <button id="stamp">Stamp: on</button>
    <button id="save">Save PNG</button>
    <span id="stats">—</span>
  </div>
  <div class="hint">18 × 24. The frame draws itself, then settles. Drag the cursor through it to smudge the ink.</div>

  <script type="module">
    import { mountLeroyCursor, CONFIG } from "./leroy-cursor.js";
    import { artNouveauFrame, strokeDriver } from "./ornament.js";

    const W = 1350, H = 1800;          // 18 × 24 at 75px/in
    const q = new URLSearchParams(location.search);

    // Poster tuning: chartreuse on the stage's own ground (the canvas stays
    // transparent), and nothing fades — the ornament is laid down once and kept.
    CONFIG.palette.ink = q.get("ink") || "#d8ff12";
    CONFIG.palette.bg = null;
    CONFIG.spine.hold = Infinity;
    CONFIG.spine.width = 2.2;          // the ornament wants a confident core line
    CONFIG.particle.hold = Infinity;
    CONFIG.particle.wander = 0.12;
    CONFIG.particle.curl = 0.02;
    CONFIG.particle.spinePull = 0.05;
    CONFIG.particle.tubeR = 6;          // a thick inked sleeve, not a haze
    CONFIG.particle.drag = 0.84;
    CONFIG.particle.size = 1.7;
    CONFIG.particle.bigChance = 0.22;
    CONFIG.particle.bigSize = 3;
    CONFIG.emit.perPoint = 12;
    CONFIG.emit.ambient = 30;
    CONFIG.emit.max = 20000;
    CONFIG.condense.captureR = 64;
    CONFIG.condense.pull = 0.5;
    CONFIG.condense.coreR = 7;
    CONFIG.condense.maxCoreR = 20;
    CONFIG.condense.capacity = 240;
    CONFIG.condense.max = 90;
    CONFIG.trail.minGap = 3.5;
    // let the ornament's own crossings make the nodes, rather than ambient beads
    CONFIG.nucleate.crossDist = 11;
    CONFIG.nucleate.crossAgeGap = 40;
    CONFIG.nucleate.minSpacing = 26;
    CONFIG.nucleate.beadEvery = 140;
    CONFIG.nucleate.slowSpeed = 0;
    CONFIG.stamp.grain = 0.2;
    CONFIG.stamp.bleed = 3.2;
    CONFIG.stamp.bleedAlpha = 0.17;
    CONFIG.stamp.blotChance = 0.3;
    CONFIG.stamp.blotScale = 1.8;
    CONFIG.stamp.mottle = 0.55;

    const makeDriver = () =>
      strokeDriver(artNouveauFrame(W, H, { lobes: +(q.get("lobes") || 8) }), +(q.get("speed") || 6));

    const canvas = document.getElementById("leroy");
    let pending = null;
    if (q.get("pump")) window.requestAnimationFrame = (cb) => { pending = cb; return 1; };

    const leroy = mountLeroyCursor(canvas, {
      auto: false,
      driver: makeDriver(),
      smoothing: 1,                          // trace the ornament exactly
      pixelRatio: +(q.get("scale") || 2),    // 2 → 2700 × 3600 (150 dpi at 18 × 24)
      repel: { radius: 90, strength: 1.1 },
    });

    // scale the poster to the window; the engine maps the pointer back itself
    const stage = document.getElementById("stage");
    const fit = () => {
      const s = Math.min(window.innerWidth / W, (window.innerHeight - 40) / H) * 0.96;
      stage.style.transform = `translate(-50%, -50%) scale(${s})`;
    };
    new ResizeObserver(fit).observe(document.documentElement);
    addEventListener("resize", fit);
    fit();

    document.getElementById("redraw").addEventListener("click", () => {
      leroy.clear();
      leroy.setDriver(makeDriver());
    });
    document.getElementById("stamp").addEventListener("click", (e) => {
      CONFIG.stamp.enabled = !CONFIG.stamp.enabled;
      e.currentTarget.textContent = `Stamp: ${CONFIG.stamp.enabled ? "on" : "off"}`;
    });
    document.getElementById("save").addEventListener("click", () => {
      // bake the ground in, so the file is the poster and not just the ink
      const out = document.createElement("canvas");
      out.width = canvas.width;
      out.height = canvas.height;
      const g = out.getContext("2d");
      const grd = g.createLinearGradient(0, 0, 0, out.height);
      grd.addColorStop(0, "#17292b");
      grd.addColorStop(0.55, "#0d1a1c");
      grd.addColorStop(1, "#081214");
      g.fillStyle = grd;
      g.fillRect(0, 0, out.width, out.height);
      g.drawImage(canvas, 0, 0);
      const a = document.createElement("a");
      a.download = `leroy-border-18x24-${out.width}x${out.height}.png`;
      a.href = out.toDataURL("image/png");
      a.click();
    });

    setInterval(() => {
      const s = leroy.stats();
      document.getElementById("stats").textContent = `${s.particles} · ${s.nuclei}`;
    }, 400);

    // dev: ?pump=N steps N frames synchronously (for offscreen/throttled pages)
    if (q.get("pump")) {
      window.__pump = (n) => {
        for (let i = 0; i < n; i++) {
          const cb = pending;
          pending = null;
          if (!cb) break;
          cb(i * 16.7);
        }
        return leroy.stats();
      };
      window.__ready = true;
      setTimeout(() => window.__pump(+q.get("pump")), 250);
    }
  </script>
</body>
</html>
